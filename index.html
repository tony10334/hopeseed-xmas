    if (opt.keys) {
      const ans = q.n === 2 && s.place ? '他去了' + s.place + '。' : q.key;
      key = '<div class="key">' + esc(ans) + (opt.accept ? '<span class="acc">可接受的說法：' + esc(q.accept) + '</span>' : '') + '</div>';
    }
    return '<li><span class="q">' + esc(q.q) + '</span>' + key + '</li>';
  }).join('') + '</ol>';
}
function secHead(title, meta) {
  return '<div class="sec-head"><h2 class="sec-title">' + esc(title) + '</h2>' + (meta || '') + '</div>';
}

/* ---------- header ---------- */
function header(s0) {
  // the band always shows the live phase; a staged change is marked on the slip instead
  const s = host && pending ? Object.assign({}, s0, { phase: STATE.phase, round: STATE.round }) : s0;
  let meta = phaseStage(s.phase);
  if (s.phase === 2) meta += (meta ? '・' : '') + (s.round > s.rounds ? '揭牌' : '第 ' + s.round + ' 輪／共 ' + s.rounds + ' 輪');
  const tabs = TABS.filter((t) => !t.host || host).map((t) => {
    const un = unlocked(t, s);
    const cls = ['tab', ui.tab === t.id ? 'on' : '', un ? '' : 'lock', t.host ? 'hostonly' : ''].join(' ');
    const attrs = (un || host) ? 'data-act="tab" data-id="' + t.id + '"' : 'disabled aria-disabled="true"';
    return '<button class="' + cls + '" ' + attrs + (ui.tab === t.id ? ' aria-current="page"' : '') + '>' + esc(t.label) + (un ? '' : '<span class="lk" role="img" aria-label="尚未開放">' + icon('lock') + '</span>') + (t.id === 'search' && ui.unseen.length && ui.tab !== 'search' ? '<span class="dot" role="img" aria-label="有新卡"></span>' : '') + '</button>';
  }).join('');
  return '<header class="top"><div class="band"><div class="band-in">' +
    '<div class="brand">' + FLOWER + '<span class="t">小花</span>' + (host ? '<span class="badge-host">主持人</span>' : '') + '</div>' +
    (host ? '' : '<span class="hr">' + teamTag(s) + '</span>') +
    '<div class="phase"><h1>' + esc(phaseTitle(s.phase)) + '</h1>' + (meta ? '<span class="meta">' + esc(meta) + '</span>' : '') + '</div>' +
    '</div></div></header><nav class="tabs" aria-label="分頁"><div class="tabs-in">' + tabs + '</div></nav>' +
    (s.note ? '<div class="note"><div class="note-in"><span class="note-k">公告</span><span>' + esc(s.note) + '</span></div></div>' : '') +
    (fb.error ? '<div class="note warn"><div class="note-in"><span class="note-k">連線</span><span>' + esc(fb.error) + '</span></div></div>' : '');
}

function footer(realHost) {
  let h = '<footer class="foot"><span class="live ' + (fb.live ? 'on' : '') + '">' + (fb.live ? '即時同步中' : (fb.demo ? (realHost ? '離線示範模式・變更不會送給任何人' : '離線示範模式') : '連線中…')) + '</span>' + (realHost ? '<span class="ver">v' + (STATE.v || 0) + '</span>' : '');
  if (realHost) h += '<span class="who">主持人' + (fb.user && fb.user.email ? '・' + esc(fb.user.email) : '') + '</span><button class="btn sm ghost" data-act="hostlogout">登出</button>';
  else if (fb.ok && fb.user && !fb.user.isAnonymous && !forcePlayer()) h += '<span class="who">已登入 ' + esc(fb.user.email || '') + '・等待主持人核准</span><button class="btn sm ghost" data-act="hostlogout">登出</button>';
  else if (fb.ok && !forcePlayer()) h += '<span class="who"></span><button class="btn sm ghost" data-act="hostlogin">主持人登入</button>';
  return h + '</footer>';
}

function teamTag(s) {
  const t = myTeam();
  if (!t) return '<button class="teamtag" data-act="pickteam">選擇組別</button>';
  if (s.allowSwitch) return '<button class="teamtag" data-act="pickteam">' + esc(teamLabel(t)) + '・換組</button>';
  return '<span class="teamtag locked" title="要換組請找主持人">' + esc(teamLabel(t)) + '</span>';
}

/* ---------- landing (phase 0) ---------- */
function landing() {
  return '<div class="landing"><div class="env-big">' +
    '<span class="stamp-big">' + FLOWER + '</span>' +
    '<span class="cancel" aria-hidden="true"><span class="ring"><b>白沙村</b><i>十二月</i></span><span class="waves"></span></span>' +
    '<div class="to"><span class="lbl">收件人</span><span class="nm">各位偵探</span></div>' +
    '<div class="big">小花</div><div class="sub">' + esc(CONTENT.subtitle) + '</div>' +
    '</div><p class="wait">主持人準備中，請把這一頁留著。<br>開場後內容會自動出現。</p></div>';
}

/* ---------- 選組 ---------- */
function viewPick(s) {
  const mine = myTeam();
  let h = '<section class="sec pick">' + secHead('你是哪一組？');
  h += '<p class="lead">選好之後，你會看到你們組拿到的卡。別組的卡要等他們公開才看得到。</p>';
  if (s.players > 0) h += '<p class="muted">共 ' + s.players + ' 人、' + s.teams.length + ' 組，每組約 ' + Math.floor(s.players / s.teams.length) + '～' + Math.ceil(s.players / s.teams.length) + ' 人。</p>';
  if (s.assign === 'number') {
    h += '<div class="pick-num"><label for="pick-num">你帶來的禮物是幾號箱？</label><div class="row"><input type="number" id="pick-num" min="1" max="' + (s.players || 60) + '" inputmode="numeric" placeholder="箱號" autocomplete="off"><button class="btn primary" data-act="joinnum">確認</button></div><p class="muted">組別依箱號自動分配，人數會平均。</p></div>';
  } else {
    const counts = teamCounts(); const cap = teamCapacity();
    h += '<div class="pick-grid">' + s.teams.map((t) => {
      const n = counts[t] || 0;
      const full = !!(cap && n >= cap && mine !== t);
      return '<button class="pick-card' + (mine === t ? ' on' : '') + (full ? ' full' : '') + '" data-act="join" data-team="' + esc(t) + '"' + (full ? ' aria-disabled="true"' : '') + '>' +
        '<span class="nm">' + esc(teamLabel(t)) + '</span>' +
        (fb.live ? '<span class="cnt">' + (full ? '已滿・' : '') + n + ' 人' + (cap ? '／' + cap : '') + '</span>' : '') +
        (mine === t ? '<span class="cur">' + icon('check') + '目前的組</span>' : '') + '</button>';
    }).join('') + '</div>';
    h += '<p class="muted">' + (cap ? '每組最多 ' + cap + ' 人，滿了請選別組。' : '請照主持人分的組來選，人數不平均時主持人會請你換組。') + '</p>';
  }
  h += '<p class="pick-skip">' + (mine ? '<button class="btn" data-act="pickcancel">先不換</button>' : '<button class="btn ghost" data-act="pickskip">先不選，看看內容</button>') + '</p>';
  return h + '</section>';
}

/* ---------- 開場 ---------- */
function hostSettings(s) {
  let h = '<section class="sec host">' + secHead('組別設定', '<span class="tag">主持人</span>');
  h += '<div class="field"><span class="lb">組數</span>' + stepper('teamcount', s.teams.length, s.teams.length > 2, s.teams.length < TEAM_ORDER.length, '', '組數') + '</div>';
  h += '<div class="field"><span class="lb">搜查輪數</span>' + stepper('rounds', s.rounds, s.rounds > 3, s.rounds < 8, '', '搜查輪數') + '</div>';
  h += '<div class="field"><span class="lb">人數</span>' + stepper('players', s.players || '未設定', true, true, '', '人數') + '</div>';
  h += '<div class="field col"><span class="lb" id="lb-assign">分組方式</span><div class="seg" role="group" aria-labelledby="lb-assign">' +
    '<button class="' + (s.assign !== 'number' ? 'on' : '') + '" data-act="assign" data-m="free" aria-pressed="' + (s.assign !== 'number') + '">玩家自己選</button>' +
    '<button class="' + (s.assign === 'number' ? 'on' : '') + '" data-act="assign" data-m="number" aria-pressed="' + (s.assign === 'number') + '">依禮物箱號</button></div></div>';
  h += '<div class="field col"><span class="lb">換組</span><button class="switch ' + (s.allowSwitch ? 'on' : '') + '" data-act="allowswitch" role="switch" aria-checked="' + (s.allowSwitch ? 'true' : 'false') + '"><span class="knob"></span>' + (s.allowSwitch ? '允許玩家換組' : '已鎖定，玩家不能換組') + '</button><span class="muted">立刻生效。分組確定後建議鎖定。</span></div>';
  if (s.assign === 'number' && s.players > 0) {
    h += '<div class="tblwrap"><table class="tbl"><thead><tr><th>組</th><th>禮物箱號</th></tr></thead><tbody>' + s.teams.map((t, i) => {
      const nums = []; for (let n = i + 1; n <= s.players; n += s.teams.length) nums.push(n);
      return '<tr><td>' + esc(teamLabel(t)) + '</td><td>' + nums.join('、') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  }
  if (fb.live) {
    const counts = teamCounts();
    h += '<div class="field col"><span class="lb">已選組</span><span class="counts">' + s.teams.map((t) => '<span><b>' + (counts[t] || 0) + '</b>' + esc(teamShort(t)) + '</span>').join('') + '</span><span class="muted">共 ' + Object.keys(fb.players).length + ' 支手機</span></div>';
  }
  return h + '</section>';
}

function viewOpen(s) {
  if (s.phase < 1 && !host) return landing();
  let h = hostSee(s, 1);
  if (host) h += hostSettings(s);
  if (!host && myTeam()) h += '<div class="callout">你們是 <b>' + esc(teamLabel(myTeam())) + '</b>。要弄清楚的六件事在這一頁下方，拿到的卡在「搜查」分頁。</div>';
  h += '<section class="sec">' + secHead('白沙村') + '<div class="prose">' + blocks(CONTENT.opening, { letter: true }) + '</div></section>';
  h += '<section class="sec">' + secHead('要弄清楚的六件事') + questionsHtml(s) + '</section>';
  h += '<section class="sec">' + secHead('不在場的人') + table([['人物', '說明']].concat(CONTENT.missing)) + '</section>';
  h += '<section class="sec">' + secHead('村裡的人') + table([['人物', '是誰', '在哪裡遇得到']].concat(CONTENT.villagers)) + '</section>';
  h += '<section class="sec">' + secHead('規則') + '<div class="prose">' + blocks(CONTENT.rulesOpen) + '</div></section>';
  return h;
}

/* ---------- 搜查 ---------- */
const flashed = (code) => [].concat(ui.flash || []).includes(code);

/* who has drawn in the current round (host) */
function roundDraws(s) {
  const n = {};
  s.teams.forEach((t) => { n[t] = { n: 0, unsent: false }; });
  Object.keys(s.slots).forEach((code) => {
    const st = s.slots[code];
    if (st && st.r === s.round && n[st.by]) { n[st.by].n += 1; if (unsent(code)) n[st.by].unsent = true; }
  });
  return n;
}
function roundTrack(s) {
  if (s.round > s.rounds) {
    return '<div class="round-track"><div class="rt-head"><b>揭牌</b><span>' + s.rounds + ' 輪搜完了</span></div><p class="muted">點地點，用「揭牌，翻到桌上」翻一張給全場看。</p>' + locChips(s) + '</div>';
  }
  const n = roundDraws(s);
  const left = s.teams.filter((t) => !n[t].n);
  let h = '<div class="round-track"><div class="rt-head"><b>第 ' + s.round + ' 輪</b><span>' + (left.length ? '還沒抽：' + left.map(teamShort).join('、') : '每組都抽過了') + '</span></div>';
  h += '<div class="rt-teams">' + s.teams.map((t) => {
    const x = n[t];
    const cls = 'rt' + (x.n ? ' on' : '') + (x.unsent ? ' unsent' : '');
    const say = teamLabel(t) + (x.n ? '本輪已抽' + (x.n > 1 ? ' ' + x.n + ' 張' : '') + (x.unsent ? '・還沒送出' : '') : '本輪還沒抽');
    return '<span class="' + cls + '" role="img" aria-label="' + esc(say) + '">' + (x.n ? icon('check') : '') + esc(t) + (x.n > 1 ? '<small>×' + x.n + '</small>' : '') + '</span>';
  }).join('') + '</div>';
  h += locChips(s);
  if (!left.length) h += '<button class="btn" data-act="round" data-d="1">' + (s.round >= s.rounds ? '進入揭牌' : '進入第 ' + (s.round + 1) + ' 輪') + '</button>';
  return h + '</div>';
}
function locChips(s) {
  return '<div class="sheet-lb">直接抽卡</div><div class="rt-locs">' + CONTENT.locations.map((l) => {
    const rem = l.cards.filter((c) => !s.slots[c.code]).length;
    return '<button class="rt-loc" data-act="drawsheet" data-loc="' + esc(l.id) + '"' + (rem ? '' : ' disabled') + '><b>' + esc(l.name) + '</b><span>' + (rem ? '剩 ' + rem + ' 張' : '抽完了') + '</span></button>';
  }).join('') + '</div>';
}
function slotHtml(c, s) {
  const st = s.slots[c.code];
  const num = c.code.split('-').pop();
  let cls = 'pm', inner;
  if (!st) {
    cls += ' down';
    inner = '<b>' + esc(num) + '</b>';
    if (host && STATE.slots[c.code] && pending) cls += ' unsent';
  } else {
    if (st.by === '桌') { cls += ' table'; inner = '<b>桌上</b><i>' + esc(c.code) + '</i>'; }
    else { cls += st.pub ? ' pub' : ' drawn'; inner = '<b>' + esc(teamShort(st.by)) + '</b><i>' + esc(c.code) + '</i>'; }
    if (!host && st.by === myTeam()) cls += ' mine';
    if (unsent(c.code)) cls += ' unsent';
    if (flashed(c.code)) cls += ' landed';
  }
  const label = c.code + '・' + (st ? (st.by === '桌' ? '桌上公開' : teamLabel(st.by) + (st.pub ? '・已公開' : '')) : '還在牌堆') + (cls.includes(' mine') ? '・你們組' : '') + (cls.includes('unsent') ? '・還沒送出' : '');
  if (!host) return '<span class="' + cls + '" role="img" aria-label="' + esc(label) + '">' + inner + '</span>';
  return '<button class="' + cls + '" data-act="sel" data-code="' + esc(c.code) + '" aria-label="' + esc(label) + '">' + inner + '</button>';
}

function letterRow(c, st, mine) {
  const secret = !!(mine && st.by === mine && !st.pub);
  const holder = st.by === '桌' ? '桌上公開'
    : teamLabel(st.by) + (st.pub ? '・已公開' : (secret ? '' : (host ? '・只有該組和你看得到' : '')));
  const text = c.type === 'clue' || c.type === 'say' ? c.text : typeText[c.type];
  return '<div class="letter-row ' + c.type + (secret ? ' secret' : '') + (flashed(c.code) ? ' new' : '') + (ui.fresh.includes(c.code) ? ' fresh' : '') + '" id="lr-' + esc(c.code) + '"><div class="lr-tag"><span class="code">' + esc(c.code) + '</span><span class="chip ' + c.type + '">' + typeLabel[c.type] + '</span><span class="holder">' + esc(holder) + '</span>' + (secret ? '<span class="chip secret">' + icon('lock') + '只有你們組</span>' : '') + '</div>' +
    '<p class="lr-text">' + esc(text) + '</p></div>';
}

function deckHtml(deck, s) {
  const remaining = deck.cards.filter((c) => !s.slots[c.code]).length;
  let h = '<section class="env"><div class="env-head"><h2>' + esc(deck.name) + '</h2><span class="rem">剩 ' + remaining + ' 張</span></div>';
  if (deck.meet) h += '<p class="meet">' + esc(deck.meet) + '</p>';
  h += '<div class="pms">' + deck.cards.map((c) => slotHtml(c, s)).join('') + '</div>';
  if (host) {
    h += '<div class="env-act"><button class="btn draw" data-act="drawsheet" data-loc="' + esc(deck.id) + '"' + (remaining ? '' : ' disabled') + '>' + (remaining ? '抽下一張給…' : '這一疊抽完了') + '</button></div>';
  }
  const mine = host ? null : myTeam();
  const visible = deck.cards.filter((c) => {
    const st = s.slots[c.code];
    if (host) return !!ui.showAll;   // the host opens a card by tapping its postmark
    return st && (st.pub || (mine && st.by === mine));
  });
  if (visible.length) {
    h += '<div class="letters">' + visible.map((c) => {
      const st = s.slots[c.code];
      return st ? letterRow(c, st, mine) : '<div class="letter-row undrawn"><div class="lr-tag"><span class="code">' + esc(c.code) + '</span><span class="chip ' + c.type + '">' + typeLabel[c.type] + '</span><span class="holder">還在牌堆</span></div><p class="lr-text">' + esc(c.type === 'clue' || c.type === 'say' ? c.text : typeText[c.type]) + '</p></div>';
    }).join('') + '</div>';
  } else if (!host) {
    h += '<p class="env-empty">' + (mine ? '你們組在這裡還沒有卡。' : '還沒有公開的卡。') + '</p>';
  }
  return h + '</section>';
}

function mineStrip(s, mine) {
  const codes = [];
  allDecks().forEach((d) => d.cards.forEach((c) => { const st = s.slots[c.code]; if (st && st.by === mine) codes.push(c.code); }));
  let h = '<div class="round-track mine-strip"><div class="rt-head"><b>我們組的卡</b><span>' + (codes.length ? codes.length + ' 張・點一下看內容' : esc(teamLabel(mine))) + '</span></div>';
  if (!codes.length) return h + '<p class="muted">還沒有卡。主持人抽給你們之後會出現在這裡。</p></div>';
  return h + '<div class="mine-pms">' + codes.map((code) => {
    const st = s.slots[code];
    return '<button class="pm ' + (st.pub ? 'pub' : 'drawn mine') + (flashed(code) ? ' landed' : '') + (ui.fresh.includes(code) ? ' fresh' : '') + '" data-act="jump" data-code="' + esc(code) + '" aria-label="' + esc(code + (st.pub ? '・已公開' : '・只有你們組看得到')) + '"><b>' + esc(code.split('-')[0]) + '</b><i>' + esc(code.split('-').pop()) + '</i></button>';
  }).join('') + '</div></div>';
}

function viewSearch(s) {
  let h = hostSee(s, 2);
  if (host) h += roundTrack(s);
  else if (myTeam()) h += mineStrip(s, myTeam());
  h += '<div class="search-intro"><div class="legend"><span><i class="pm down"></i>牌堆</span>' + (!host && myTeam() ? '<span><i class="pm drawn mine"></i>你們組的秘密卡</span>' : '') + '<span><i class="pm drawn"></i>已抽</span><span><i class="pm pub"></i>已公開</span><span><i class="pm table"></i>桌上</span>' + (host ? '<span class="lg-red"><i class="pm drawn unsent"></i>未送出</span>' : '') + '</div>';
  h += '<details class="rules"><summary>' + (host ? '說明與搜查規則' : '搜查規則') + '</summary>';
  if (host) h += '<p class="muted">點郵戳可以看內容、公開、改給別組或取消。</p><button class="switch ' + (ui.showAll ? 'on' : '') + '" data-act="showall" role="switch" aria-checked="' + (ui.showAll ? 'true' : 'false') + '"><span class="knob"></span>在信封裡列出全部卡片內容</button>';
  h += '<div class="prose">' + blocks(CONTENT.searchRules) + '</div></details></div>';
  h += CONTENT.locations.map((l) => deckHtml(l, s)).join('');
  if (CONTENT.people.length) h += '<h3 class="sub-title">村民</h3>' + CONTENT.people.map((p) => deckHtml(p, s)).join('');
  return h;
}

/* ---------- bottom sheets (host) ---------- */
function sheetWrap(title, sub, body) {
  return '<div class="sheet-back" data-act="sheetclose"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="sheet-in">' +
    '<div class="sheet-head"><div><h2 class="sheet-title">' + esc(title) + '</h2>' + (sub ? '<div class="sheet-sub">' + sub + '</div>' : '') + '</div>' +
    '<button class="btn icon ghost" data-act="sheetclose" aria-label="關閉">' + icon('close') + '</button></div>' + body + '</div></div>';
}
function drawSheet(s, locId) {
  const deck = findLoc(locId);
  if (!deck) return '';
  const next = deck.cards.find((c) => !s.slots[c.code]);
  if (!next) return sheetWrap(deck.name, '這一疊已經抽完了', '');
  const canFlip = deck.cards.some((c) => !s.slots[c.code] && (c.type === 'clue' || c.type === 'say'));
  const rd = s.round <= s.rounds ? roundDraws(s) : null;
  let body = '<div class="team-grid">' + s.teams.map((t) => {
    const done = rd && rd[t].n;
    return '<button class="team-btn' + (done ? ' done' : '') + '" data-act="draw" data-loc="' + esc(deck.id) + '" data-team="' + esc(t) + '">' + esc(teamLabel(t)) + (done ? '<small>' + icon('check') + '本輪已抽</small>' : '') + '</button>';
  }).join('') + '</div>';
  if (s.autoPublic) body += '<p class="muted">「抽到即公開」開著：這張會直接公開給全場。</p>';
  if (s.round > s.rounds) body += '<div class="sheet-foot"><button class="btn primary wide" data-act="flip" data-loc="' + esc(deck.id) + '"' + (canFlip ? '' : ' disabled') + '>揭牌，翻到桌上</button><p class="muted">翻開剩下的第一張物證卡或證詞卡，放在桌上給全場看。</p></div>';
  const allDone = rd && s.teams.every((t) => rd[t].n);
  return sheetWrap(next.code + ' 給哪一組？', esc(deck.name) + '・下一張是' + typeLabel[next.type] + (allDone ? '・本輪每組都抽過了' : ''), body);
}
function cardSheet(s, code) {
  const c = findCard(code);
  if (!c) return '';
  const st = s.slots[code];
  const text = c.type === 'clue' || c.type === 'say' ? c.text : typeText[c.type];
  const deck = allDecks().find((d) => d.cards.includes(c));
  let sub = esc(deck ? deck.name : '') + '・' + typeLabel[c.type];
  let body = '<p class="sheet-text">' + esc(text) + '</p>';
  if (!st) {
    body += '<p class="muted">還在牌堆。用信封下方的「抽下一張給…」依順序抽。</p>';
  } else {
    sub += '・' + (st.by === '桌' ? '桌上公開' : teamLabel(st.by) + (st.pub ? '・已公開' : '・只有該組看得到'));
    if (unsent(code)) sub += '・<span class="red">還沒送出</span>';
    body += '<button class="btn wide" data-act="pub" data-code="' + esc(code) + '">' + (st.pub ? icon('undo') + '收回公開' : icon('open') + '公開內容給全場') + '</button>';
    if (st.by !== '桌') {
      body += '<div class="sheet-lb">改給</div><div class="team-grid sm">' + s.teams.map((t) => '<button class="team-btn' + (t === st.by ? ' on' : '') + '" data-act="give" data-code="' + esc(code) + '" data-team="' + esc(t) + '"' + (t === st.by ? ' disabled' : '') + '>' + esc(teamShort(t)) + '</button>').join('') + '</div>';
    }
    body += '<div class="sheet-foot danger-zone"><button class="btn danger" data-act="undraw" data-code="' + esc(code) + '">取消抽卡，放回牌堆</button></div>';
  }
  return sheetWrap(code, sub, body);
}

/* ---------- 問村長 ---------- */
function ansClass(a) { const f = ANSWERS.find((x) => x[0] === a); return f ? f[1] : 'na'; }

function viewSoup(s) {
  const timer = s.soupStart ? '<div class="timer' + (s.soupPause ? ' paused' : '') + '" id="timer">' + timerText(s) + '</div>' : '<div class="timer" id="timer">30:00<small>尚未開始</small></div>';
  let top = '<section class="sec">' + secHead('計時', host ? '<span class="live-note">這一頁的操作會立刻同步</span>' : '') + timer;
  if (host) top += timerControls(s) + dueHintHtml(s);
  top += '<p class="muted">村長只回答「是」「不是」「沒有關係」「不知道」。輪到你們時，可以改成正式答題：六題一口氣講完。</p>';
  top += '<details class="rules"><summary>問村長規則</summary>' + table([['項目', '規則']].concat(CONTENT.soupRules)) + '</details></section>';

  const six = '<section class="sec">' + secHead('六題') + questionsHtml(s) + '</section>';

  const mine = host ? null : myTeam();
  let quota = '<section class="sec">' + secHead('問號額度') + '<div class="stamps n' + s.teams.length + '">' + s.teams.map((t) =>
    '<div class="stamp-wrap"><div class="stamp' + (mine === t ? ' mine' : '') + '"><span class="n">' + (s.qm[t] == null ? 0 : s.qm[t]) + '</span><span class="t">' + esc(teamLabel(t)) + '</span></div>' +
    (host ? stepper('qm', '', (s.qm[t] || 0) > 0, true, 'data-team="' + esc(t) + '"', teamLabel(t) + '的問號') : '') + '</div>').join('') + '</div>';
  if (host) quota += '<p class="muted">抽到問號卡時自動 +1；記錄一題自動 −1。</p><button class="btn sm" data-act="qmreset">全部重設為 ' + BASE_QM + ' 個</button>';
  quota += '</section>';

  let hints = '<section class="sec">' + secHead('提示') + '<div class="hints">' + CONTENT.hints.map((x, i) => {
    const on = i < s.hints;
    return '<div class="hint ' + (on ? 'on' : 'off') + '"><span class="when">第 ' + x.min + ' 分鐘</span><span class="tx">' + (on ? esc(x.text) : '尚未公布') + '</span></div>';
  }).join('') + '</div>';
  if (host) hints += '<div class="row-btns"><button class="btn primary" data-act="hint" data-d="1" ' + (s.hints >= CONTENT.hints.length ? 'disabled' : '') + '>公布下一則</button><button class="btn" data-act="hint" data-d="-1" ' + (s.hints <= 0 ? 'disabled' : '') + '>收回上一則</button></div>';
  hints += '</section>';

  let qa = '<section class="sec">' + secHead('問答紀錄', s.qa.length ? '<span class="meta">' + s.qa.length + ' 題</span>' : '');
  if (host) qa += qaForm(s);
  qa += s.qa.length ? '<ol class="qa">' + s.qa.map((x, i) => [x, i]).reverse().map(([x, i]) =>
    '<li class="qa-row"><span class="i">' + (i + 1) + '</span><div class="qa-body"><span class="who">' + esc(teamLabel(x.t)) + '</span><span class="q">' + esc(x.q) + '</span></div><span class="ans ' + ansClass(x.a) + '">' + esc(x.a) + '</span></li>').join('') + '</ol>'
    : '<p class="muted">還沒有人提問。</p>';
  if (host && s.qa.length) qa += '<div class="danger-zone"><button class="btn danger sm" data-act="qadel">刪除最新一則（問號加回）</button></div>';
  qa += '</section>';

  // the host's job here is recording questions; players mostly watch the quota and hints
  return hostSee(s, 3) + (host ? top + qa + quota + hints + six : top + quota + hints + qa + six);
}

/* the next hint whose minute has passed (host) */
function dueHint(s) {
  if (!s.soupStart || s.hints >= CONTENT.hints.length) return -1;
  return soupElapsedMs(s) >= CONTENT.hints[s.hints].min * 60000 ? s.hints : -1;
}
function dueHintHtml(s) {
  const i = dueHint(s);
  if (i < 0) return '';
  const x = CONTENT.hints[i];
  return '<div class="due"><div><b>第 ' + x.min + ' 分鐘到了</b><span>提示 ' + (i + 1) + '：' + esc(x.text) + '</span></div><button class="btn primary" data-act="hint" data-d="1">公布提示 ' + (i + 1) + '</button></div>';
}

function timerControls(s) {
  if (!s.soupStart) return '<div class="row-btns"><button class="btn primary" data-act="timer" data-m="start">開始 30 分鐘</button></div>';
  if (ui.timerArmed) return '<div class="row-btns confirm"><button class="btn danger" data-act="timer" data-m="start">確定從 30:00 重來</button><button class="btn" data-act="timer" data-m="restartno">取消</button></div>';
  return '<div class="row-btns">' + (s.soupPause
    ? '<button class="btn primary" data-act="timer" data-m="resume">繼續計時</button>'
    : '<button class="btn" data-act="timer" data-m="pause">暫停</button>') +
    '<button class="btn ghost" data-act="timer" data-m="restartask">重新開始…</button></div>';
}

/* the village chief's answer table, searched from what the host types */
const normQ = (x) => String(x || '').replace(/[\s？?，,。！!「」、：:]/g, '');
function qaMatches(q) {
  const n = normQ(q);
  if (n.length < 2) return [];
  const grams = []; for (let i = 0; i < n.length - 1; i++) grams.push(n.slice(i, i + 2));
  const need = Math.max(1, Math.ceil(grams.length * 0.5));
  return CONTENT.qa.map((r, i) => {
    const t = normQ(r.q);
    const score = (t.includes(n) ? 100 : 0) + grams.filter((g) => t.includes(g)).length;
    return { i, r, score };
  }).filter((x) => x.score >= need).sort((a, b) => b.score - a.score).slice(0, 4);
}
function suggestHtml(q) {
  if (normQ(q).length < 2) return '';
  const m = qaMatches(q);
  if (!m.length) return '<p class="muted">問答表裡沒有像這樣的題目，請自己判斷。</p>';
  return '<div class="sheet-lb">問答表裡的類似題目（點一下帶入）</div>' + m.map(({ i, r }) =>
    '<button class="sug" data-act="qapick" data-i="' + i + '"><span class="sq">' + esc(r.q) + '</span><span class="ans ' + ansClass(r.a) + '">' + esc(r.a) + '</span>' + (r.n ? '<span class="sn">' + esc(r.n) + '</span>' : '') + '</button>').join('');
}

function qaForm(s) {
  const cur = s.teams.includes(ui.qaTeam) ? ui.qaTeam : s.teams[0];
  let h = '<div class="qa-form"><div class="sheet-lb" id="lb-qateam">哪一組問</div><div class="seg teams" role="group" aria-labelledby="lb-qateam">' + s.teams.map((t) =>
    '<button class="' + (t === cur ? 'on' : '') + '" data-act="qateam" data-team="' + esc(t) + '" aria-pressed="' + (t === cur ? 'true' : 'false') + '">' + esc(teamShort(t)) + '<small>' + (s.qm[t] == null ? 0 : s.qm[t]) + ' 個問號</small></button>').join('') + '</div>';
  h += '<label class="sheet-lb" for="qa-q">問題</label><input type="text" id="qa-q" class="input" placeholder="例：小花是人嗎？" autocomplete="off" value="' + esc(ui.qaDraft || '') + '">';
  const left = s.qm[cur] || 0;
  h += left > 0 ? '<div class="sheet-lb">村長回答（按下就記錄，' + esc(teamShort(cur)) + '扣 1 個問號）</div>'
    : '<p class="warn-line">' + esc(teamShort(cur)) + '的問號用完了。這題仍可記錄，但不會再扣。</p><div class="sheet-lb">村長回答（按下就記錄）</div>';
  h += '<div class="ans-grid">' +
    ANSWERS.map((a) => '<button class="ans-btn ' + a[1] + (ui.qaHint === a[0] ? ' hint' : '') + '" data-act="qaadd" data-a="' + a[0] + '">' + a[0] + (ui.qaHint === a[0] ? '<small>問答表的答案</small>' : '') + '</button>').join('') + '</div>' +
    '<div class="suggest" id="qa-suggest">' + (ui.qaHint ? '' : suggestHtml(ui.qaDraft)) + '</div></div>';
  return h;
}

/* ---------- 答案 ---------- */
// 取消 takes the slot the host just tapped, so a double tap cancels instead of revealing
function revealConfirm(place) {
  const cancel = '<button class="btn big" data-act="revealcancel">取消</button>';

}
function endingCard(s, just) {
  const e = CONTENT.endings[s.ending];

}

function viewAnswer(s) {
  let h = hostSee(s, 4);
  const revealed = !!(s.truth && s.ending && s.report);
  if (host) {
    h += '<section class="sec host">' + secHead('公布答案', '<span class="live-note">按下立刻同步</span>');
    h += revealed
      ? '<p class="lead">已公布・他去了' + esc(s.place || '') + '。</p><div class="danger-zone"><button class="btn danger" data-act="hideall">全部收回</button></div>'
      : ui.revealArmed
        ? '<p class="lead">確定公布「他去了' + esc(ui.revealArmed) + '」？所有人的手機會立刻看到結局、真相、六題解答和報告。</p><div class="reveal-btns armed">' + revealConfirm(ui.revealArmed) + '</div>'
        : '<p class="muted">選答對組說的地方。按一下會先請你確認，再按一次才會送給所有人，階段也會切到「答案」。</p><div class="reveal-btns"><button class="btn primary big" data-act="revealask" data-place="沖繩">他去了沖繩</button><button class="btn primary big" data-act="revealask" data-place="花蓮">他去了花蓮</button></div>';

  } else h += '<div class="sealed">' + icon('lock') + '結局尚未公布</div>';

  return h;
}

    h += '<div class="slip-state"><span class="slip-k ok">' + icon('check') + '已全部送出</span><span class="slip-list">玩家看到的就是現在這樣</span></div>';
  }
  if (list.length || ui.discarded || ui.tab === 'search') h += '<button class="btn send" data-act="publish" ' + ((!list.length || publishing || !fb.ok) ? 'disabled' : '') + '>' + (publishing ? '更新中…' : '更新給所有人') + '</button>';
  h += '</div>';
  return h + '</div></div>';
}

/* ---------- render ---------- */
let lastSheet = null;
const cssq = (v) => ((window.CSS && CSS.escape) ? CSS.escape(v) : String(v).replace(/"/g, '\\"'));
// a selector that finds the same control again after the page is rebuilt
function controlKey(el) {
  const t = el.closest('[data-act]');
  if (!t) return null;
  return Object.keys(t.dataset).map((k) => '[data-' + k.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase()) + '="' + cssq(t.dataset[k]) + '"]').join('');
}
const detKey = (dt) => { const s = dt.querySelector('summary'); return s ? s.textContent.trim() : ''; };
// while the host types (問村長, 公告 excluded), the slip steps aside for the keyboard
function syncTyping() {
  const a = document.activeElement;
  document.body.classList.toggle('typing', !!(a && a.tagName === 'INPUT' && root.contains(a) && !a.closest('.slip') && a.type !== 'number' || (a && a.id === 'pick-num')));
}
function render() {
  // keep focus and caret in a text field across re-renders (live updates arrive while the host types)
  const ae = document.activeElement;
  const keep = ae && ae.id && root.contains(ae) && (ae.tagName === 'INPUT') ? { id: ae.id, a: ae.selectionStart, b: ae.selectionEnd } : null;
  const focusSel = !keep && ae && ae !== document.body && root.contains(ae) ? controlKey(ae) : null;
  const realHost = host;
  if (ui.preview && realHost) host = false;   // render exactly what a player sees
  try { renderInner(); } finally { host = realHost; }
  root.insertAdjacentHTML('beforeend', footer(realHost));
  if (realHost && ui.preview) {
    root.insertAdjacentHTML('beforeend', '<button class="btn primary previewbar" data-act="preview">' + icon('eye') + '玩家視角預覽中' + (pending ? '（含未送出的變更）' : '') + '・返回主持人</button>');
  }
  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(keep.a, keep.b); } catch (e) { /* number inputs */ } }
  } else if (focusSel) {
    const el = root.querySelector(focusSel);
    if (el) el.focus({ preventScroll: true });
  }
  root.querySelectorAll('details').forEach((dt) => { const k = detKey(dt); if (k in ui.det) dt.open = ui.det[k]; });
  const sl = root.querySelector('.slip');
  document.documentElement.style.setProperty('--slip-h', (sl ? sl.offsetHeight : 0) + 'px');
  syncTyping();
  const sh = root.querySelector('.sheet');
  document.body.classList.toggle('sheet-open', !!sh);
  // the page behind an open sheet is out of reach for keyboard and screen readers
  if (sh) Array.from(root.children).forEach((c) => { if (!c.classList.contains('sheet') && !c.classList.contains('sheet-back')) c.inert = true; });
  const key = sh ? (ui.sel || ui.sheet) : null;
  if (key && key !== lastSheet) { sh.setAttribute('tabindex', '-1'); sh.focus({ preventScroll: true }); }
  else if (!key && lastSheet) {
    const q = cssq(lastSheet);
    const back = root.querySelector('[data-act="sel"][data-code="' + q + '"]') || root.querySelector('[data-act="drawsheet"][data-loc="' + q + '"]');
    if (back) back.focus({ preventScroll: true });
  }
  lastSheet = key;
}

function renderInner() {
  const s = S();
  let tab = TABS.find((t) => t.id === ui.tab);
  if (!tab || (!unlocked(tab, s) && !host)) { ui.tab = DEFAULT_TAB[s.phase] || 'open'; tab = TABS.find((t) => t.id === ui.tab); }
  let body;
  switch (tab.id) {
    case 'open': body = viewOpen(s); break;
    case 'search': body = viewSearch(s); break;
    case 'soup': body = viewSoup(s); break;
    case 'answer': body = viewAnswer(s); break;
    case 'manual': body = viewManual(s); break;
    default: body = '';
  }
  if (!host && (ui.picking || (!myTeam() && !ui.skippedPick && s.phase < 4))) body = viewPick(s);
  if (host && ui.shareOpen) body = sharePanel() + body;
  let sheet = '';
  if (host && tab.id === 'search') {
    if (ui.sel) sheet = cardSheet(s, ui.sel);
    else if (ui.sheet) sheet = drawSheet(s, ui.sheet);
  }
  root.innerHTML = header(s) + '<main class="wrap' + (host ? ' has-slip' : '') + '">' + body + '</main>' + (host ? hostbar(s) : '') + sheet;
  if (ui.filter && $('#man-qa')) applyFilter();
  ui.flash = null; ui.postJust = false;
}

function applyFilter() {
  const q = ui.filter.trim();
  document.querySelectorAll('#man-qa tbody tr').forEach((tr) => { tr.hidden = !!q && !tr.textContent.includes(q); });
}

/* ---------- actions ---------- */
// a confirm button that just appeared ignores taps for a moment (double-tap guard)
function arm() { ui.armAt = Date.now(); }
function tooSoon() { return Date.now() - (ui.armAt || 0) < 600; }

function act(d) {
  switch (d.act) {
    case 'tab': if (d.id === 'search' && ui.unseen.length) { ui.flash = ui.unseen; ui.unseen = []; } ui.tab = d.id; ui.sel = null; ui.sheet = null; ui.revealArmed = null; ui.timerArmed = false; ui.moreOpen = false; ui.noteOpen = false; saveTab(); render(); window.scrollTo(0, 0); break;
    case 'preview': ui.preview = !ui.preview; ui.sel = null; ui.sheet = null; ui.noteOpen = false; ui.moreOpen = false; ui.picking = false; render(); window.scrollTo(0, 0); break;
    case 'share': ui.shareOpen = !ui.shareOpen; ui.moreOpen = false; render(); if (ui.shareOpen) window.scrollTo(0, 0); break;
    case 'more': ui.moreOpen = !ui.moreOpen; if (!ui.moreOpen) ui.noteOpen = false; render(); break;
    case 'copylink': {
      const url = d.url || SITE_URL;
      const done = () => toast('已複製連結');
      const fail = () => {
        const inp = Array.from(root.querySelectorAll('.share input')).find((i) => i.value === url);
        if (inp) { inp.focus(); inp.select(); }
        toast('無法自動複製，請長按或全選連結後複製');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, fail); else fail();
      break;
    }
    case 'pickteam': if (myTeam() && !S().allowSwitch) { toast('組別已鎖定，要換組請找主持人'); return; } ui.picking = true; render(); window.scrollTo(0, 0); break;
    case 'pickcancel': ui.picking = false; render(); break;
    case 'pickskip': ui.skippedPick = true; ui.picking = false; render(); break;
    case 'join': {
      if (myTeam() && myTeam() !== d.team && !S().allowSwitch) { toast('組別已鎖定，要換組請找主持人'); return; }
      const cap = teamCapacity(); const n = (teamCounts()[d.team] || 0);
      if (cap && n >= cap && myTeam() !== d.team) { toast(teamLabel(d.team) + '已經滿了，請選別組'); return; }
      joinTeam(d.team); ui.picking = false; ui.skippedPick = false; toast('你們是' + teamLabel(d.team)); render(); window.scrollTo(0, 0);
      break;
    }
    case 'joinnum': {
      const n = parseInt($('#pick-num') ? $('#pick-num').value : '', 10);
      if (!n || n < 1) { toast('請輸入禮物箱號'); return; }
      const s = S(); const t = s.teams[(n - 1) % s.teams.length];
      joinTeam(t, n); ui.picking = false; ui.skippedPick = false; toast(n + ' 號箱・你們是' + teamLabel(t)); render(); window.scrollTo(0, 0);
      break;
    }
    case 'hostlogin': hostLogin(); break;
    case 'hostlogout': hostLogout(); break;
    case 'hostapprove': approveHost(d.uid); break;
    case 'hostremove': removeHost(d.uid); break;
    case 'hostreject': rejectRequest(d.uid); break;
    case 'reset': ui.resetArmed = !ui.resetArmed; if (ui.resetArmed) arm(); render(); break;
    case 'resetgo': if (tooSoon()) return; resetGame(); break;
    case 'phase': edit((p) => {
      const np = clamp(p.phase + Number(d.d), 0, LAST_PHASE);
      if (np === p.phase) return false;
      p.phase = np; p.note = '';   // an old 公告 does not follow the game into the next phase
    }); break;
    case 'round': edit((p) => { p.round = clamp(p.round + Number(d.d), 1, (p.rounds || 6) + 1); }); break;
    case 'rounds': immediate((p) => { p.rounds = clamp((p.rounds || 6) + Number(d.d), 3, 8); if (p.round > p.rounds + 1) p.round = p.rounds + 1; }); break;
    case 'autopub': edit((p) => { p.autoPublic = !p.autoPublic; }); break;
    case 'teamcount': immediate((p) => {
      const n = clamp(p.teams.length + Number(d.d), 2, TEAM_ORDER.length);
      p.teams = TEAM_ORDER.slice(0, n);
      p.teams.forEach((t) => { if (p.qm[t] == null) p.qm[t] = BASE_QM; });
    }); break;
    case 'assign': immediate((p) => { p.assign = d.m; }); break;
    case 'players': immediate((p) => { p.players = clamp((p.players || 0) + Number(d.d), 0, 60); }); break;
    case 'allowswitch': immediate((p) => { p.allowSwitch = !p.allowSwitch; }); break;
    case 'drawsheet': ui.sel = null; ui.sheet = d.loc; render(); break;
    case 'sheetclose': ui.sel = null; ui.sheet = null; render(); break;
    case 'draw': edit((p) => {
      const c = findLoc(d.loc).cards.find((c) => !p.slots[c.code]);
      if (!c) { toast('這一疊已經抽完了'); return false; }
      p.slots[c.code] = { by: d.team, pub: !!p.autoPublic, r: p.round };
      if (c.type === 'qmark') p.qm[d.team] = (p.qm[d.team] || 0) + 1;
      ui.sheet = null; ui.sel = null; ui.flash = c.code;
      toast(c.code + ' 給' + teamLabel(d.team) + '・按「更新給所有人」送出');
    }); break;
    case 'flip': edit((p) => {
      const c = findLoc(d.loc).cards.find((c) => !p.slots[c.code] && (c.type === 'clue' || c.type === 'say'));
      if (!c) { toast('這個地點沒有可以翻的卡了'); return false; }
      p.slots[c.code] = { by: '桌', pub: true };
      ui.sheet = null; ui.sel = null; ui.flash = c.code;
    }); break;
    case 'sel': ui.sheet = null; ui.sel = ui.sel === d.code ? null : d.code; render(); break;
    case 'pub': edit((p) => { const st = p.slots[d.code]; if (st) st.pub = !st.pub; }); break;
    case 'undraw': edit((p) => {
      const st = p.slots[d.code]; const c = findCard(d.code);
      if (st && c && c.type === 'qmark' && st.by !== '桌') p.qm[st.by] = Math.max(0, (p.qm[st.by] || 0) - 1);
      delete p.slots[d.code]; ui.sel = null;
    }); break;
    case 'give': edit((p) => {
      const st = p.slots[d.code]; const c = findCard(d.code);
      if (!st || !c) return false;
      if (c.type === 'qmark') { if (st.by !== '桌') p.qm[st.by] = Math.max(0, (p.qm[st.by] || 0) - 1); p.qm[d.team] = (p.qm[d.team] || 0) + 1; }
      st.by = d.team;
    }); break;
    case 'qm': immediate((p) => { p.qm[d.team] = Math.max(0, (p.qm[d.team] || 0) + Number(d.d)); }); break;
    case 'qmreset': immediate((p) => { p.teams.forEach((t) => { p.qm[t] = BASE_QM; }); }); break;
    case 'hint': immediate((p) => { p.hints = clamp(p.hints + Number(d.d), 0, CONTENT.hints.length); }); break;
    case 'timer':
      if (d.m === 'restartask' || d.m === 'restartno') { ui.timerArmed = d.m === 'restartask'; if (ui.timerArmed) arm(); render(); break; }
      if (d.m === 'start' && ui.timerArmed && tooSoon()) return;
      ui.timerArmed = false;
      {
        const now = Date.now();
        immediate((p) => {
          if (d.m === 'start') { p.soupStart = now; p.soupPause = null; }
          else if (d.m === 'pause') { if (!p.soupStart || p.soupPause) return false; p.soupPause = now; }
          else if (d.m === 'resume') { if (!p.soupPause) return false; p.soupStart += now - p.soupPause; p.soupPause = null; }
        });
      }
      break;
    case 'qateam': ui.qaTeam = d.team; render(); break;
    case 'qapick': { const r = CONTENT.qa[Number(d.i)]; if (!r) return; ui.qaDraft = r.q; ui.qaHint = r.a; render(); break; }
    case 'qaadd': {
      const teams = S().teams;
      const team = teams.includes(ui.qaTeam) ? ui.qaTeam : teams[0];
      const q = ($('#qa-q') ? $('#qa-q').value : (ui.qaDraft || '')).trim();
      if (!q) { toast('請先輸入問題'); if ($('#qa-q')) $('#qa-q').focus(); return; }
      ui.qaDraft = ''; ui.qaHint = null;
      const nx = teams[(teams.indexOf(team) + 1) % teams.length];
      ui.qaTeam = nx;
      toast('已記錄' + teamShort(team) + '的問題・接下來輪到' + teamShort(nx));
      immediate((p) => { p.qa.push({ t: team, q: q, a: d.a }); p.qm[team] = Math.max(0, (p.qm[team] || 0) - 1); });
      break;
    }
    case 'qadel': immediate((p) => { const x = p.qa.pop(); if (x && p.qm[x.t] != null) p.qm[x.t] += 1; }); break;
    case 'revealask': ui.revealArmed = d.place; arm(); render(); break;
    case 'revealcancel': ui.revealArmed = null; render(); break;
    case 'revealall': if (tooSoon()) return; ui.revealArmed = null; immediate((p) => { if (!d.place) return false; p.place = d.place; p.truth = true; p.ending = d.place === '沖繩' ? 'A' : 'B'; p.report = true; if (p.phase < 4) p.phase = 4; }); break;
    case 'hideall': immediate((p) => { p.truth = false; p.ending = null; p.report = false; p.place = null; }); break;
    case 'showall': ui.showAll = !ui.showAll; render(); break;
    case 'openpost': ui.postOpen = S().place; ui.postJust = true; try { localStorage.setItem('xh_post', ui.postOpen || ''); } catch (e) { /* no storage */ } render(); window.scrollTo(0, 0); break;
    case 'jump': {
      if (ui.fresh.includes(d.code)) { ui.fresh = ui.fresh.filter((x) => x !== d.code); render(); }
      const el = document.getElementById('lr-' + d.code);
      if (!el) break;
      const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      el.scrollIntoView({ behavior: still ? 'auto' : 'smooth', block: 'start' });
      el.classList.remove('new'); void el.offsetWidth; el.classList.add('new');
      break;
    }
    case 'notetoggle': ui.noteOpen = !ui.noteOpen; render(); if (ui.noteOpen && $('#note-input')) $('#note-input').focus(); break;
    case 'notesave': { const v = ($('#note-input') ? $('#note-input').value : '').trim(); ui.noteOpen = false; edit((p) => { p.note = v; }); break; }
    case 'noteclear': ui.noteOpen = false; edit((p) => { p.note = ''; }); break;
    case 'publish': ui.moreOpen = false; publish(); break;
    case 'discard': {
      const at = Date.now();
      ui.discarded = { p: pending, b: pendingBase, n: pendingList().length, at: at };
      pending = null; clearStash(); ui.sel = null; render();
      setTimeout(() => { if (ui.discarded && ui.discarded.at === at) { ui.discarded = null; render(); } }, 8000);
      break;
    }
    case 'undodiscard': if (ui.discarded) { const x = ui.discarded; pending = x.b ? rebase(x.b, x.p, STATE).p : x.p; pendingBase = clone(STATE); ui.discarded = null; stash(); render(); } break;
    default: break;
  }
}

root.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  act(el.dataset);
});
root.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('[data-act][role="button"]');
  if (el) { e.preventDefault(); act(el.dataset); }
});
root.addEventListener('input', (e) => {
  if (e.target.id === 'man-filter') { ui.filter = e.target.value; applyFilter(); }
  if (e.target.id === 'qa-q') {
    // update the suggestions in place so the phone keyboard stays open
    ui.qaDraft = e.target.value; ui.qaHint = null;
    const box = $('#qa-suggest'); if (box) box.innerHTML = suggestHtml(ui.qaDraft);
    root.querySelectorAll('.ans-btn.hint').forEach((b) => { b.classList.remove('hint'); const sm = b.querySelector('small'); if (sm) sm.remove(); });
  }
});
root.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'qa-q') { e.preventDefault(); toast('請按下面的答案按鈕記錄'); }
  if (e.key === 'Enter' && e.target.id === 'note-input') { e.preventDefault(); act({ act: 'notesave' }); }
  if (e.key === 'Enter' && e.target.id === 'pick-num') { e.preventDefault(); act({ act: 'joinnum' }); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (ui.sel || ui.sheet)) { ui.sel = null; ui.sheet = null; render(); }
});
root.addEventListener('toggle', (e) => { if (e.target.tagName === 'DETAILS') ui.det[detKey(e.target)] = e.target.open; }, true);
root.addEventListener('focusin', syncTyping);
root.addEventListener('focusout', () => setTimeout(syncTyping, 0));

/* ---------- boot ---------- */
(function boot() {
  try { ui.tab = sessionStorage.getItem('xh_tab'); } catch (e) { ui.tab = null; }
  try { ui.postOpen = localStorage.getItem('xh_post') || null; } catch (e) { ui.postOpen = null; }
  toastEl();
  render();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initFirebase); else initFirebase();
})();

</script>
</body>
</html>
