<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>小花</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script defer src="config.js"></script>
<style id="css">
/* ============================================================
   《小花》 — 掛號信與郵戳
   Post-office green band, envelope-white sheets, airmail stripes.
   Postmarks carry state: red = only on the host's phone, green = sent.
   ============================================================ */
:root{
  --bg:#eef2ec; --surf:#ffffff; --surf-2:#f4f7f2; --surf-3:#e5ebe3;
  --ink:#232825; --ink-2:#434b46; --muted:#5d665f;
  --line:#cfd8ce; --line-2:#e3e9e1; --dash:#7d8e80;
  --band:#3a8f66; --post:#2f7d58; --post-ink:#24704d; --post-soft:#e1efe6; --post-line:#a7cbb6;
  --red:#c9473d; --red-ink:#b23f36; --red-soft:#f9e8e5; --red-line:#e8c2bd;
  --pill-bg:#ffffff; --pill-ink:#24704d;
  --shadow:0 10px 26px -18px rgba(var(--sh-rgb),.45),0 1px 2px rgba(var(--sh-rgb),.06);
  --r:18px; --r-sm:12px; --pill:999px;
  --t-xs:.75rem; --t-sm:.8125rem; --t-ui:.875rem; --t-body:.9375rem; --t-md:1rem; --t-read:1.125rem;
  --t-h3:1.25rem; --t-h2:1.5rem; --t-title:1.625rem; --t-display:2.5rem; --t-stat:2.75rem; --t-hero:4rem;
  --sh-rgb:28,52,40;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,sans-serif;
  --round:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --hand:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC","Noto Serif TC",serif;
  --stripe:repeating-linear-gradient(-45deg,var(--red) 0 9px,var(--surf) 9px 14px,var(--band) 14px 23px,var(--surf) 23px 28px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111513; --surf:#1a1f1c; --surf-2:#212723; --surf-3:#2b322e;
    --ink:#e6ebe7; --ink-2:#c2cac4; --muted:#9aa39c;
    --line:#38423c; --line-2:#2c342f; --dash:#66756b;
    --band:#24573f; --post:#2f7d58; --post-ink:#93d3b0; --post-soft:#1d3a2b; --post-line:#3f6f56;
    --red:#c4463c; --red-ink:#f0938a; --red-soft:#3a2321; --red-line:#6a3a35;
    --pill-bg:#e3ece6; --pill-ink:#1d4d36;
    --shadow:0 12px 28px -18px rgba(0,0,0,.8),0 1px 2px rgba(0,0,0,.4);
    --sh-rgb:0,0,0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111513; --surf:#1a1f1c; --surf-2:#212723; --surf-3:#2b322e;
  --ink:#e6ebe7; --ink-2:#c2cac4; --muted:#9aa39c;
  --line:#38423c; --line-2:#2c342f; --dash:#66756b;
  --band:#24573f; --post:#2f7d58; --post-ink:#93d3b0; --post-soft:#1d3a2b; --post-line:#3f6f56;
  --red:#c4463c; --red-ink:#f0938a; --red-soft:#3a2321; --red-line:#6a3a35;
  --pill-bg:#e3ece6; --pill-ink:#1d4d36;
  --shadow:0 12px 28px -18px rgba(0,0,0,.8),0 1px 2px rgba(0,0,0,.4);
  --sh-rgb:0,0,0;
  color-scheme:dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:76px;scroll-padding-bottom:calc(var(--slip-h,0px) + 12px);background:var(--bg);scrollbar-color:var(--line) transparent}
body{background:var(--bg);color:var(--ink);font:var(--t-md)/1.7 var(--sans);-webkit-text-size-adjust:100%;caret-color:var(--post);font-variant-numeric:tabular-nums}
body.sheet-open{overflow:hidden}
::selection{background:var(--post-soft);color:var(--ink)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--post);outline-offset:2px;border-radius:10px}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:400}
p{margin:0}
.boot{padding:40px 16px;text-align:center;color:var(--muted)}
.wrap{max-width:720px;margin:0 auto;padding:16px 12px 40px}
.wrap.has-slip{padding-bottom:16px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.flower{width:22px;height:22px;flex:none}
.muted{color:var(--muted);font-size:var(--t-ui);line-height:1.65;margin:8px 0}
.lead{font-size:var(--t-md);margin:4px 0 8px}
.red{color:var(--red-ink);font-weight:700}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ---------- header: post-office band + tabs ---------- */
.band{background:var(--band);color:#fff;position:relative;padding-top:env(safe-area-inset-top,0px)}
.band-in{max-width:720px;margin:0 auto;padding:14px 16px 16px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px 12px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand .flower{background:var(--pill-bg);border-radius:50%;padding:2px;width:26px;height:26px}
.brand .t{font:400 var(--t-h2)/1 var(--round);letter-spacing:.08em}
.badge-host{font:700 var(--t-xs)/1 var(--sans);letter-spacing:.08em;color:var(--pill-ink);background:var(--pill-bg);padding:5px 10px;border-radius:var(--pill)}
.hr{justify-self:end}
.teamtag{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:0;border-radius:var(--pill);background:var(--pill-bg);color:var(--pill-ink);font:700 var(--t-ui)/1 var(--sans);cursor:pointer}
.teamtag.locked{cursor:default}
.phase{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.phase h1{font:400 var(--t-display)/1.1 var(--round);letter-spacing:.04em}
.phase .meta{background:var(--pill-bg);color:var(--pill-ink);font:700 var(--t-ui)/1 var(--sans);padding:7px 12px;border-radius:var(--pill)}
.tabs{position:sticky;top:0;z-index:20;background:var(--post);padding-bottom:6px;box-shadow:0 8px 18px -14px rgba(var(--sh-rgb),.6)}
.tabs::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--stripe)}
.tabs-in{max-width:720px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:6px 8px 8px}
.tabs-in::-webkit-scrollbar{display:none}
@media (max-width:359px){.tab{padding:0 5px;gap:2px;font-size:var(--t-ui)}.tab .lk .ic{width:12px;height:12px}.tabs-in{padding:6px 4px 8px;gap:0;-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent)}}
.tab{flex:1 0 auto;min-height:44px;border:0;background:none;padding:0 10px;font-size:var(--t-body);color:#fff;cursor:pointer;white-space:nowrap;border-radius:var(--pill);display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tab:hover{background:rgba(255,255,255,.12)}
.tab.on{background:var(--pill-bg);color:var(--pill-ink);font-weight:700}
.tab .lk .ic{width:14px;height:14px}
.tabs :focus-visible{outline-color:var(--pill-bg)}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--pill-bg);box-shadow:0 0 0 2px var(--post);margin:-10px 0 0 1px;flex:none}
.note{background:var(--surf);border-bottom:1px solid var(--line)}
.note.warn{background:var(--red-soft)}
.note.warn .note-k{color:var(--red-ink);border-color:var(--red-ink)}
.note-in{max-width:720px;margin:0 auto;padding:10px 16px;font-size:var(--t-body);display:flex;gap:10px;align-items:baseline}
.note-k{flex:none;font:700 var(--t-sm)/1 var(--sans);color:var(--post-ink);border:1.5px solid var(--post-ink);border-radius:8px;padding:4px 6px}

/* ---------- sheets of paper ---------- */
.sec{background:var(--surf);border-radius:var(--r);padding:20px 18px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-title{font:400 var(--t-h2)/1.3 var(--round);letter-spacing:.03em}
.sec-head .meta,.sec-head .tag{margin-left:auto;font:700 var(--t-sm)/1 var(--sans);color:var(--post-ink);background:var(--post-soft);border-radius:var(--pill);padding:6px 11px}
.sec-head .btn.icon{margin-left:auto}
.live-note{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:var(--t-sm);color:var(--post-ink)}
.live-note::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--post)}
.sub-title{font:400 var(--t-h3)/1.3 var(--round);margin:22px 0 8px;color:var(--post-ink)}
.prose{font-family:var(--hand);font-size:var(--t-read);line-height:1.9;max-width:36em}
.prose p+p{margin-top:.8em}
.prose .sub{font:700 var(--t-body)/1.5 var(--sans);margin:1.4em 0 .5em;color:var(--post-ink)}
.prose .list{margin:.6em 0;padding-left:1.3em;font-family:var(--sans);font-size:var(--t-body);line-height:1.75}
.prose .list li+li{margin-top:.35em}
.prose .list li::marker{color:var(--post)}
.prose .tblwrap{font-family:var(--sans)}
.callout{background:var(--post-soft);color:var(--post-ink);border-radius:var(--r-sm);padding:12px 16px;margin-bottom:14px;font-size:var(--t-body)}
.hostnote{display:flex;gap:8px;align-items:center;font-size:var(--t-ui);color:var(--post-ink);border:1.5px dashed var(--post-line);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:14px;background:var(--surf)}
.sealed{display:flex;gap:8px;align-items:center;justify-content:center;padding:20px 16px;border:2px dashed var(--dash);border-radius:var(--r-sm);color:var(--muted);font-size:var(--t-body)}
.sealed .ic{width:18px;height:18px}

/* landing: a sealed envelope addressed to the players */
.landing{padding:18px 4px 8px;text-align:center}
.env-big{position:relative;background:var(--surf);padding:44px 24px 40px;text-align:left;box-shadow:var(--shadow);border:10px solid transparent;border-image:var(--stripe) 10;max-width:560px;margin:0 auto}
.stamp-big{position:absolute;top:16px;right:16px;width:66px;height:80px;display:grid;place-items:center;background:var(--post-soft);border:5px dotted var(--surf)}
.stamp-big .flower{width:38px;height:38px}
.cancel{position:absolute;top:22px;right:58px;display:flex;align-items:center;transform:rotate(-10deg);color:var(--post-ink)}
.cancel .ring{width:72px;height:72px;border:2px solid currentColor;border-radius:50%;display:grid;place-content:center;text-align:center;line-height:1.25}
.cancel .ring b{font:700 var(--t-sm) var(--sans);letter-spacing:.1em}
.cancel .ring i{font:500 var(--t-xs) var(--sans);font-style:normal}
.cancel .waves{width:60px;height:34px;margin-left:-4px;background:repeating-linear-gradient(transparent 0 6px,currentColor 6px 8px)}
.to{display:flex;flex-direction:column;gap:2px;margin-top:64px}
.to .lbl{font-size:var(--t-sm);color:var(--muted);letter-spacing:.2em}
.to .nm{font:400 var(--t-h3)/1.4 var(--hand);border-bottom:1.5px solid var(--line);padding-bottom:4px;max-width:14em}
.landing .big{font:400 clamp(var(--t-hero),20vw,6.5rem)/1 var(--round);letter-spacing:.08em;margin-top:26px}
.landing .sub{margin-top:12px;color:var(--ink-2);font-size:var(--t-ui);letter-spacing:.16em}
.landing .wait{margin-top:24px;color:var(--muted);font-size:var(--t-body);line-height:1.85}

/* tables */
.tblwrap{overflow-x:auto;margin:.6em 0;border-radius:var(--r-sm);background:var(--surf-2)}
.tbl{border-collapse:collapse;width:100%;min-width:420px;font-size:var(--t-ui)}
.tbl th,.tbl td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-2);line-height:1.6}
.tbl th{font-weight:700;white-space:nowrap;font-size:var(--t-sm);color:var(--ink-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{white-space:nowrap;font-weight:500}

/* airmail letter (opening) */
.letter{margin:22px 0;background:var(--surf) repeating-linear-gradient(transparent 0 35px,var(--line-2) 35px 36px);border:8px solid transparent;border-image:var(--stripe) 8;background-origin:content-box;padding:14px 22px 18px;font-family:var(--hand);font-size:var(--t-read);line-height:36px;max-width:32em;color:var(--ink)}
.letter p,.prose .letter p+p{margin:0}
.letter .sig{display:flex;justify-content:flex-end;align-items:center;gap:12px}
.seal{display:inline-grid;place-items:center;width:32px;height:32px;border:2px solid var(--red-ink);color:var(--red-ink);border-radius:8px;font:700 var(--t-md)/1 var(--hand);transform:rotate(-8deg)}

/* six questions */
.qs{margin:0;padding-left:1.7em;display:grid}
.qs li{padding:10px 0;border-bottom:1px solid var(--line-2)}
.qs li:last-child{border-bottom:0}
.qs li::marker{color:var(--post-ink);font:700 var(--t-body) var(--sans)}
.qs .q{font-family:var(--hand);font-size:var(--t-read);line-height:1.7}
.qs .key{font-size:var(--t-ui);color:var(--ink-2);margin-top:4px}
.qs .key .acc{display:block;color:var(--muted);font-size:var(--t-ui);margin-top:2px}

/* ---------- pick a team ---------- */
.pick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.pick-card{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;border:2px solid var(--line-2);background:var(--surf);border-radius:8px;padding:18px 14px 12px;cursor:pointer;min-height:72px}
.pick-card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--stripe)}
.pick-card:hover{border-color:var(--post-line)}
.pick-card .nm{font:400 var(--t-h3)/1.2 var(--round)}
.pick-card .cnt{font-size:var(--t-ui);color:var(--muted)}
.pick-card .cur{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-sm);font-weight:700;color:var(--post-ink)}
.pick-card .cur .ic{width:16px;height:16px}
.pick-card.on{border-color:var(--post);background:var(--post-soft)}
.pick-card.full{opacity:.5;cursor:default}
.pick-num{margin-top:14px;border-radius:16px;padding:18px;background:var(--surf-2)}
.pick-num label{display:block;font-weight:700;margin-bottom:10px}
.pick-num .row{display:flex;gap:8px;align-items:center}
.pick-num input{font:400 var(--t-h2) var(--round);height:52px;padding:0 14px;border:2px solid var(--dash);border-radius:12px;background:var(--surf);color:var(--ink);width:140px;text-align:center}
.pick-skip{margin-top:16px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:2px solid var(--line);background:var(--surf);color:var(--ink);border-radius:var(--pill);font-size:var(--t-body);font-weight:500;line-height:1.2;cursor:pointer;white-space:nowrap;transition:background-color .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--post-line)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.sm{min-height:44px;padding:0 14px;font-size:var(--t-ui)}
.btn.icon{width:44px;padding:0}
.btn.primary{background:var(--post);border-color:var(--post);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--post-ink);border-color:var(--post-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--red-ink);border-color:var(--red-line)}
.btn.danger:hover{background:var(--red-soft)}
.btn.danger.solid{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.danger.solid:hover{background:var(--red-ink);border-color:var(--red-ink)}
.btn.wide{width:100%;min-height:52px;font-size:var(--t-md)}
.btn.big{min-height:58px;font-size:var(--t-read)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.reveal-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.reveal-btns .btn{white-space:normal;flex-direction:column;gap:2px;line-height:1.25;padding:8px 10px}
.reveal-btns .btn small{font-size:var(--t-ui);font-weight:500}
.reveal-btns.armed .btn.primary{animation:fade .2s ease-out}
.danger-zone{margin-top:20px;padding-top:16px;border-top:1.5px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px}
.input{width:100%;min-height:48px;font:var(--t-md) var(--sans);padding:0 14px;border:2px solid var(--dash);border-radius:var(--r-sm);background:var(--surf);color:var(--ink)}
.input:focus{border-color:var(--post);outline:0}
.input::placeholder{color:var(--muted)}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surf-2);border-radius:var(--pill);padding:3px}
.stepper .btn{border-color:transparent;background:var(--surf);min-height:44px;width:44px}
.stepper .val{min-width:3.2em;text-align:center;font-weight:700;font-size:var(--t-body);padding:0 4px;white-space:nowrap}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.field:last-child{border-bottom:0}
.field.col{flex-direction:column;align-items:flex-start;gap:8px}
.field .lb{font-weight:700;font-size:var(--t-body)}
.seg{display:inline-flex;background:var(--surf-2);border-radius:var(--pill);padding:4px;gap:2px;flex-wrap:wrap}
.seg button{min-height:44px;padding:0 16px;border:0;border-radius:var(--pill);background:none;color:var(--ink-2);cursor:pointer;font-size:var(--t-body)}
.seg button.on{background:var(--surf);color:var(--post-ink);font-weight:700;box-shadow:0 2px 8px -4px rgba(var(--sh-rgb),.4)}
.switch{display:inline-flex;align-items:center;gap:10px;min-height:44px;border:0;background:none;padding:0;cursor:pointer;font-size:var(--t-body);color:var(--ink-2);text-align:left}
.switch .knob{flex:none;width:44px;height:26px;border-radius:var(--pill);background:var(--line);position:relative;transition:background-color .15s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surf);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.switch.on{color:var(--post-ink);font-weight:700}
.switch.on .knob{background:var(--post)}
.switch.on .knob::after{transform:translateX(18px)}
.counts{display:flex;flex-wrap:wrap;gap:6px}
.counts span{background:var(--surf-2);border-radius:var(--pill);padding:4px 12px;font-size:var(--t-ui)}
.counts b{color:var(--post-ink);margin-right:4px}
details.rules{margin-top:14px;border-top:1.5px dashed var(--line)}
details.rules[open]{padding-bottom:6px}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;min-height:48px;font-weight:700;font-size:var(--t-body)}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details[open]>summary::after{transform:rotate(-135deg)}

/* ---------- 搜查: envelopes and postmarks ---------- */
.search-intro{padding:2px 4px 10px}
.round-track{background:var(--surf);border-radius:var(--r-sm);box-shadow:0 0 0 1px var(--line-2),0 6px 14px -10px rgba(var(--sh-rgb),.35);padding:12px 14px;margin:0 0 12px}
.rt-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rt-head b{font:400 var(--t-h3)/1.3 var(--round)}
.rt-head span{margin-left:auto;font-size:var(--t-ui);color:var(--ink-2)}
.round-track .muted{margin-top:6px}
.rt-teams{display:flex;gap:6px;margin-top:10px}
.rt{flex:1 1 0;min-height:40px;border-radius:10px;border:1.5px dashed var(--dash);display:flex;align-items:center;justify-content:center;gap:2px;font-size:var(--t-body);color:var(--muted)}
.rt.on{border:1.5px solid var(--post);background:var(--post-soft);color:var(--post-ink);font-weight:700}
.rt.unsent{border-color:var(--red);background:var(--red-soft);color:var(--red-ink)}
.rt .ic{width:15px;height:15px}
.rt small{font-size:var(--t-xs);font-weight:500}
.round-track .btn{width:100%;margin-top:10px}
.round-track .sheet-lb{margin:12px 0 6px}
.rt-locs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rt-loc{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:52px;padding:6px 10px;border:1.5px solid var(--post-line);border-radius:10px;background:var(--surf);color:var(--ink);text-align:left;cursor:pointer;line-height:1.3}
.rt-loc b{font:400 var(--t-body)/1.25 var(--round);color:var(--post-ink)}
.rt-loc span{font-size:var(--t-xs);color:var(--muted)}
.rt-loc:active{background:var(--post-soft)}
.rt-loc:disabled{border-style:dashed;border-color:var(--dash);cursor:default}
.rt-loc:disabled b{color:var(--muted)}
.mine-pms{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mine-pms .pm{width:52px;height:52px}
.mine-pms .pm:nth-child(even){transform:rotate(6deg)}
.search-intro details.rules{margin-top:8px}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:var(--t-sm);color:var(--ink-2);margin:2px 0 4px}
.legend .lg-red{color:var(--red-ink)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .pm{width:18px;height:18px;border-width:2px;transform:none;box-shadow:none}
.env{position:relative;background:var(--surf);border-radius:8px;padding:22px 14px 14px;margin-bottom:12px;box-shadow:0 0 0 1px var(--line-2),0 6px 14px -10px rgba(var(--sh-rgb),.35);overflow:hidden}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--stripe)}
.env-head{display:flex;align-items:baseline;gap:10px}
.env-head h2{font:400 var(--t-h3)/1.3 var(--round);letter-spacing:.04em}
.env-head .rem{margin-left:auto;color:var(--muted);font-size:var(--t-ui)}
.meet{font-size:var(--t-ui);color:var(--muted);margin-top:4px}
.pms{display:grid;grid-template-columns:repeat(7,minmax(0,64px));gap:4px;margin-top:14px}
.pm{aspect-ratio:1;width:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;border:2px solid var(--post-ink);background:var(--surf);color:var(--post-ink);font-family:var(--sans);text-align:center;line-height:1.05}
.pm b{font-size:var(--t-sm);font-weight:700}
.pm i{font-style:normal;font-size:var(--t-xs);font-weight:500}
.pm.drawn,.pm.pub,.pm.table{box-shadow:inset 0 0 0 2px var(--surf),inset 0 0 0 3.5px currentColor;transform:rotate(-7deg)}
.pms>.pm:nth-child(even).drawn,.pms>.pm:nth-child(even).pub,.pms>.pm:nth-child(even).table{transform:rotate(6deg)}
.pm.down{border:2px dashed var(--dash);color:var(--muted);background:none}
.pm.down b{font-size:var(--t-body);font-weight:500}
.pm.pub{background:var(--post);border-color:var(--post);color:#fff;box-shadow:inset 0 0 0 2px var(--post),inset 0 0 0 3.5px rgba(255,255,255,.75)}
.pm.table{color:var(--ink-2);border-color:var(--ink-2);background:var(--surf-2)}
.pm.drawn.mine{background:var(--ink);border-color:var(--ink);color:var(--surf);box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 3.5px var(--surf)}
.pm.unsent{color:var(--red-ink);border-color:var(--red)}
.pm.pub.unsent{background:var(--red);border-color:var(--red);color:#fff;box-shadow:inset 0 0 0 2px var(--red),inset 0 0 0 3.5px rgba(255,255,255,.75)}
.pm.down.unsent{border-color:var(--red);color:var(--red-ink)}
button.pm{cursor:pointer}
button.pm:active{filter:brightness(.95)}
.pm.landed{animation:stamp .34s cubic-bezier(.2,.8,.2,1)}
@keyframes stamp{0%{transform:scale(1.7) rotate(-18deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-7deg)}}
.env-act{margin-top:14px}
.env-act .btn{width:100%;min-height:48px;font-size:var(--t-md)}
.env-act .btn.draw{border-color:var(--post);color:var(--post-ink);font-weight:700}
.env-act .btn.draw:hover{background:var(--post-soft)}
.env-empty{margin-top:12px;font-size:var(--t-ui);color:var(--muted)}
.letters{margin-top:14px;border-top:1.5px dashed var(--line)}
.letter-row{padding:12px 2px;border-bottom:1px solid var(--line-2)}
.letter-row:last-child{border-bottom:0;padding-bottom:2px}
.letter-row.undrawn .lr-text{color:var(--ink-2)}
.letter-row.new{animation:arrive 2.4s ease-out;margin:0 -14px;padding-left:16px;padding-right:16px}
.letter-row.fresh{background:var(--post-soft);margin:0 -14px;padding-left:16px;padding-right:16px}
.mine-pms .pm{position:relative}
.mine-pms .pm.fresh::after{content:"新";position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--post);color:#fff;font:700 var(--t-xs)/20px var(--sans);text-align:center;transform:rotate(7deg);box-shadow:0 0 0 2px var(--surf)}
@media (prefers-reduced-motion:reduce){.letter-row.new{background:var(--post-soft);margin:0 -14px;padding-left:16px;padding-right:16px}}
@keyframes arrive{0%,35%{background:var(--post-soft)}100%{background:transparent}}
.lr-tag{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--t-sm)}
.lr-tag .code{font-weight:700;color:var(--post-ink)}
.lr-tag .holder{color:var(--muted)}
.lr-text{font-family:var(--hand);font-size:var(--t-read);line-height:1.8;margin-top:4px}
.chip{display:inline-block;border-radius:var(--pill);padding:2px 9px;font-size:var(--t-xs);font-weight:700;line-height:1.5}
.chip.clue{background:var(--post-soft);color:var(--post-ink)}
.chip.say{background:var(--surf-3);color:var(--ink-2)}
.chip.ticket{background:none;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.chip.qmark{background:var(--surf-3);color:var(--ink-2)}
.chip.secret{display:inline-flex;align-items:center;gap:3px;background:var(--ink);color:var(--surf)}
.chip.secret .ic{width:12px;height:12px}
.letter-row{scroll-margin-top:84px}

/* ---------- bottom sheet ---------- */
.sheet-back{position:fixed;inset:0;z-index:40;background:rgba(18,32,25,.42);animation:fade .2s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:86vh;max-height:86dvh;overflow-y:auto;background:var(--surf);border-radius:22px 22px 0 0;box-shadow:0 -14px 40px -16px rgba(0,0,0,.45);padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:rise .26s cubic-bezier(.2,.8,.2,1)}
.sheet-in{max-width:560px;margin:0 auto}
.sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet-head>div{flex:1;min-width:0}
.sheet-title{font:400 var(--t-title)/1.25 var(--round);margin:0}
.sheet:focus{outline:none}
.sheet-sub{font-size:var(--t-ui);color:var(--muted);margin-top:4px}
.sheet-text{font-family:var(--hand);font-size:var(--t-read);line-height:1.85;background:var(--surf-2);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:14px}
.sheet-lb{display:block;font-weight:700;font-size:var(--t-ui);color:var(--ink-2);margin:16px 0 8px}
.sheet-foot{margin-top:16px;padding-top:14px;border-top:1.5px dashed var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sheet-foot .muted{margin:0}
.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.team-btn{min-height:60px;border:2px solid var(--post-line);border-radius:16px;background:var(--post-soft);color:var(--post-ink);font:700 var(--t-read)/1.2 var(--sans);cursor:pointer;padding:0 6px;transition:background-color .12s,transform .1s}
.team-btn:hover{border-color:var(--post)}
.team-btn:active{background:var(--post);color:#fff;transform:scale(.97)}
.team-btn:disabled{cursor:default}
.team-btn.on{background:var(--post);border-color:var(--post);color:#fff;opacity:1}
.team-btn.done{background:var(--surf-2);border-color:var(--line);color:var(--ink-2)}
.team-btn small{display:flex;align-items:center;justify-content:center;gap:2px;font-size:var(--t-sm);font-weight:500;margin-top:3px;color:var(--muted)}
.team-btn small .ic{width:13px;height:13px}
.team-grid.sm .team-btn{min-height:48px;font-size:var(--t-body)}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:340px){.team-grid{grid-template-columns:repeat(2,1fr)}}

/* ---------- 問村長 ---------- */
.timer{font:400 var(--t-hero)/1 var(--round);text-align:center;background:var(--surf-2);border-radius:16px;padding:20px 16px 16px;margin-top:4px;letter-spacing:.02em}
.timer small{display:block;font:500 var(--t-ui) var(--sans);color:var(--muted);margin-top:10px;letter-spacing:0}
.timer.over{background:var(--red-soft);color:var(--red-ink)}
.timer.over small{color:var(--red-ink)}
.timer.paused{color:var(--muted)}
.due{display:flex;gap:12px;align-items:center;margin-top:12px;padding:12px 12px 12px 14px;border-radius:var(--r-sm);background:var(--post-soft);color:var(--post-ink)}
.due>div{flex:1;min-width:0;display:flex;flex-direction:column;font-size:var(--t-ui);line-height:1.5}
.due b{font-size:var(--t-body)}
.due span{color:var(--ink-2);font-family:var(--hand);font-size:var(--t-md)}
.due .btn{flex:none}
.warn-line{color:var(--red-ink);font-size:var(--t-ui);font-weight:700;margin:14px 0 0}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stamps.n2{grid-template-columns:repeat(2,1fr)}
.stamps.n4{grid-template-columns:repeat(2,1fr)}
.stamps.n2 .stamp,.stamps.n4 .stamp{aspect-ratio:5/4}
.stamps>*{min-width:0}
.stamp-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.stamp{width:100%;aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--post-soft);border:6px dotted var(--surf);outline:1.5px solid var(--post-line);outline-offset:-10px;color:var(--post-ink)}
.stamp .n{font:400 var(--t-stat)/1 var(--round)}
.stamp .t{font-size:var(--t-sm);font-weight:700;color:var(--ink-2)}
.stamp.mine{background:var(--post);color:#fff;outline-color:rgba(255,255,255,.6)}
.stamp.mine .t{color:#fff}
.stamp-wrap .stepper .val{display:none}
.hints{display:grid;gap:8px}
.hint{display:flex;gap:14px;align-items:baseline;border-radius:var(--r-sm);padding:12px 14px;background:var(--surf-2)}
.hint .when{font-size:var(--t-sm);color:var(--post-ink);font-weight:700;white-space:nowrap;min-width:5.5em}
.hint .tx{font-family:var(--hand);font-size:var(--t-read)}
.hint.off{background:none;border:2px dashed var(--dash);color:var(--muted)}
.hint.off .when{color:var(--muted)}
.qa-form{padding:0 0 18px;margin-bottom:12px;border-bottom:1.5px dashed var(--line)}
.qa-form .sheet-lb:first-child{margin-top:4px}
.seg.teams{display:grid;grid-template-columns:repeat(3,1fr);width:100%;gap:6px;padding:0;background:none}
.seg.teams button{border-radius:12px;min-height:52px;background:var(--surf);border:2px solid var(--line);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;font-size:var(--t-body)}
.seg.teams small{font-size:var(--t-xs);font-weight:500;color:var(--muted)}
.seg.teams button.on{background:var(--post);border-color:var(--post);color:#fff;box-shadow:none}
.seg.teams button.on small{color:#fff}
.ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;border-radius:12px;border:2px solid transparent;font:700 var(--t-read)/1 var(--sans);cursor:pointer;transition:transform .1s}
.ans-btn:active{transform:scale(.97)}
.ans-btn small{display:block;font-size:var(--t-xs);font-weight:500;margin-top:5px}
.ans-btn.hint{outline:3px solid var(--ink);outline-offset:3px}
.suggest{display:grid;gap:6px}
.suggest:empty{display:none}
.sug{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;min-height:48px;padding:8px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surf);color:var(--ink);cursor:pointer}
.sug:hover{border-color:var(--post-line)}
.sug .sq{font-family:var(--hand);font-size:var(--t-md);line-height:1.45}
.sug .sn{grid-column:1/-1;font-size:var(--t-sm);color:var(--muted)}
.ans-btn.yes{background:var(--post);color:#fff}
.ans-btn.no{background:var(--ink);color:var(--surf)}
.ans-btn.na{background:var(--surf);border-color:var(--line);color:var(--ink)}
.ans-btn.unk{background:var(--surf);border:2px dashed var(--dash);color:var(--ink-2)}
.qa{list-style:none;margin:0;padding:0;display:grid}
.qa-row{display:grid;grid-template-columns:2em 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line-2)}
.qa-row:last-child{border-bottom:0}
.qa-row .i{color:var(--muted);font-size:var(--t-sm);text-align:right}
.qa-body{display:flex;flex-direction:column;min-width:0}
.qa-body .who{font-size:var(--t-sm);color:var(--muted)}
.qa-body .q{font-family:var(--hand);font-size:var(--t-read);line-height:1.5}
.ans{font-size:var(--t-ui);font-weight:700;padding:3px 10px;white-space:nowrap;border-radius:var(--pill);border:2px solid transparent}
.ans.yes{background:var(--post);color:#fff}
.ans.no{background:var(--ink);color:var(--surf)}
.ans.na{background:var(--surf-3);color:var(--ink-2)}
.ans.unk{border-style:dashed;border-color:var(--dash);color:var(--ink-2)}

/* ---------- 答案 ---------- */
.postcard{border-radius:16px;padding:20px 20px 22px;background:var(--surf-2);position:relative}
.postcard::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;border-radius:16px 16px 0 0;background:var(--stripe)}
.pc-head{display:flex;align-items:baseline;gap:10px;margin:6px 0 12px}
.pc-head span{font-size:var(--t-ui);color:var(--muted)}
.pc-head b{font:400 var(--t-title)/1.2 var(--round);color:var(--post-ink)}
.pc-pm{position:absolute;top:18px;right:18px;width:62px;height:62px;transform:rotate(-9deg)}
.pc-pm b{font-size:var(--t-sm)}
.sec.reveal{background:none;box-shadow:none;padding:0}
.reveal .postcard{background:var(--surf);box-shadow:var(--shadow);padding:30px 20px 24px;overflow:clip}
.reveal .pc-head{padding-right:72px}
.unfold .postcard{animation:unfold .9s cubic-bezier(.16,1,.3,1) both}
.unfold .pc-pm{animation:stamp .36s cubic-bezier(.2,.8,.2,1) .7s both}
@keyframes unfold{from{clip-path:inset(0 0 100% 0 round 16px);transform:translateY(-10px) rotate(-1.5deg)}to{clip-path:inset(0 0 0 0 round 16px);transform:none}}
button.mailcard{display:block;width:100%;font:inherit;color:inherit;cursor:pointer;transition:transform .15s}
button.mailcard:active{transform:scale(.985)}
.mailcard .mc-msg{display:block;font:400 var(--t-title)/1.35 var(--round);margin-top:28px}
.mailcard .mc-act{display:inline-flex;align-items:center;gap:8px;margin-top:22px;min-height:52px;padding:0 22px;border-radius:var(--pill);background:var(--post);color:#fff;font:700 var(--t-read)/1 var(--sans)}
.report{border-radius:16px;padding:18px 20px;background:var(--surf-2)}
.report .prose{font-family:var(--sans);font-size:var(--t-body);line-height:1.8}
.report .prose p+p{margin-top:.35em}

/* ---------- host: the registered-mail slip ---------- */
body.typing .slip{display:none}
.slip{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:75vh;max-height:75dvh;overflow-y:auto;background:var(--surf);box-shadow:0 -12px 30px -18px rgba(0,0,0,.45);padding:14px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.slip::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--stripe)}
.slip-in{max-width:720px;margin:0 auto}
.slip-row{display:flex;align-items:center;gap:6px}
.slip-row .stepper{flex-wrap:nowrap}
.slip-row .stepper .val{min-width:0}
.slip-row .stepper.phase{flex:1;min-width:0;justify-content:space-between}
.slip-row .stepper.staged .val{color:var(--red-ink)}
.slip-row .val small{display:block;font:700 var(--t-xs)/1.2 var(--sans);color:var(--red-ink);margin-top:2px}
@media (max-width:379px){.slip-row{flex-wrap:wrap}.slip-row .stepper.phase{flex:1 1 100%}.slip-row .stepper.round{flex:1}}
.slip-row .stepper.phase .val{font:400 var(--t-read)/1 var(--round);flex:1}
.slip-row .more{flex:none;background:var(--surf-2);border-color:transparent}
.slip-row .more.on{background:var(--post-soft);color:var(--post-ink)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tool{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;border:2px solid transparent;border-radius:var(--r-sm);background:var(--surf-2);color:var(--ink);font-size:var(--t-body);cursor:pointer;text-align:left}
.tool.on{background:var(--post-soft);border-color:var(--post-line);color:var(--post-ink);font-weight:700}
.note-edit{display:flex;gap:6px;margin-top:8px;align-items:center}
.slip-send{display:flex;align-items:center;gap:8px;margin-top:10px;border-radius:16px;padding:6px 6px 6px 14px}
.slip-send.dirty{background:var(--surf-2);box-shadow:inset 0 0 0 2px var(--red-line)}
.slip-send.clean{background:var(--post-soft)}
.slip-state{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.slip-k{font-weight:700;font-size:var(--t-body);color:var(--red-ink);display:inline-flex;align-items:center;gap:4px}
.slip-k.ok{color:var(--post-ink)}
.slip-k.neutral{color:var(--ink)}
.slip-k .ic{width:17px;height:17px}
.slip-line{display:flex;align-items:center;gap:10px}
.slip-k,.linkbtn{white-space:nowrap}
@media (max-width:379px){.slip-send .btn.send{padding:0 12px;font-size:var(--t-body)}.slip-line{gap:4px}}
.linkbtn{border:0;background:none;color:var(--ink-2);font:500 var(--t-ui) var(--sans);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;margin:-12px 0;padding:0 8px}
.slip-list{font-size:var(--t-sm);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slip-marks{display:flex;gap:4px;align-items:center;margin-top:4px;overflow:hidden}
.pm.mini{width:34px;height:34px;flex:none;font-size:var(--t-xs);font-weight:700;font-style:normal;transform:rotate(-7deg);box-shadow:inset 0 0 0 1.5px var(--surf-2),inset 0 0 0 2.5px currentColor}
.slip-marks .pm.mini:nth-child(even){transform:rotate(6deg)}
.mini-tag{font-style:normal;font-size:var(--t-sm);font-weight:700;color:var(--red-ink);padding:2px 8px;border:1.5px solid var(--red-line);border-radius:var(--pill);white-space:nowrap}
.btn.send{min-height:52px;padding:0 20px;background:var(--post);border-color:var(--post);color:#fff;font-weight:700;font-size:var(--t-md)}
.slip-send .btn.send:disabled{opacity:1;background:var(--surf);border-color:var(--post-line);color:var(--muted)}
.previewbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;max-width:calc(100vw - 32px);white-space:normal;box-shadow:var(--shadow);min-height:52px}
.previewbar:active{transform:translateX(-50%) scale(.97)}
.toast:not(.show){display:none}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surf);padding:10px 18px;font-size:var(--t-ui);max-width:90vw;border-radius:var(--pill);box-shadow:var(--shadow);animation:drop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

/* footer */
.foot{max-width:720px;margin:0 auto;padding:0 16px 36px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:var(--t-sm);color:var(--muted)}
.slip~.foot{padding-bottom:calc(var(--slip-h,230px) + 24px)}
.foot .live{display:inline-flex;align-items:center;gap:6px}
.foot .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.foot .live.on::before{background:var(--post)}
.foot .who{margin-left:auto}

/* share panel */
.share{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
.share .qr{background:#fff;padding:12px;border-radius:var(--r-sm);width:200px;height:200px;display:grid;place-items:center;color:#222}
.share .qr svg{display:block;width:100%;height:auto}
.share .url{display:flex;gap:6px;align-items:center}
.share .url .input{min-height:40px;font-size:var(--t-ui);background:var(--surf-2)}
.share .sheet-lb:first-child{margin-top:0}
@media (max-width:560px){.share{grid-template-columns:1fr}.share .qr{margin:0 auto}}

/* manual + hosts */
.man details{border-radius:var(--r-sm);background:var(--surf-2);margin-bottom:6px;padding:0 14px}
.man summary .k{font:700 var(--t-sm) var(--sans);color:var(--post-ink);min-width:3.6em}
.man .bd{padding:0 0 16px}
.man .bd .prose{font-family:var(--sans);font-size:var(--t-body);line-height:1.8}
.filter{margin:4px 0 8px}
.hosts{display:grid;gap:6px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surf-2);border-radius:var(--r-sm);padding:8px 8px 8px 14px;font-size:var(--t-ui);flex-wrap:wrap}
.hrow .acts{display:inline-flex;gap:6px}

</style>

const phaseName = (n) => (CONTENT.phases[n] || CONTENT.phases[0]).name;
const allDecks = () => CONTENT.locations.concat(CONTENT.people);
const findLoc = (id) => allDecks().find((l) => l.id === id);
const findCard = (code) => { for (const l of allDecks()) { const c = l.cards.find((c) => c.code === code); if (c) return c; } return null; };
const typeLabel = { clue: '物證', ticket: '箱子券', qmark: '問號', say: '證詞' };
const typeText = { ticket: '箱子券・開箱時可以開一個箱子。', qmark: '問號卡・問村長時可以多問一題。' };

function edit(fn) {
  const p = clone(S());
  if (fn(p) === false) { render(); return; }
  if (!pending) pendingBase = clone(STATE);
  pending = p;
  ui.discarded = null;
  stash();
  render();
}

/* Apply a change to the live state right away (soup / answer controls).
   Any pending batch gets the same change so a later publish does not undo it. */
async function immediate(fn) {
  if (!fb.ok || !host) { edit(fn); return; }
  const next = clone(STATE);
  if (fn(next) === false) { render(); return; }
  if (pending) { fn(pending); if (pendingBase) fn(pendingBase); }
  next.v = (STATE.v || 0) + 1;
  next.updatedAt = Date.now();
  render();
  try { await fb.db.doc('game/state').set(next); }
  catch (e) { toast('更新失敗：' + errText(e)); }
}

/* Merge the host's unsent batch onto newer live state (another host published meanwhile).
   Cards merge one by one and 問號 counts add up per team; when both hosts changed the same
   card, or the same setting, the live value stays. */
function rebase(base, mine, theirs) {
  const out = clone(theirs), lost = [];
  let remote = false;
  const put = (o, k, v) => { if (v === undefined) delete o[k]; else o[k] = clone(v); };
  new Set(Object.keys(base).concat(Object.keys(mine), Object.keys(theirs))).forEach((k) => {
    if (k === 'v' || k === 'updatedAt') return;
    if (k === 'slots' || k === 'qm') {
      const b = base[k] || {}, m = mine[k] || {}, t = theirs[k] || {};
      out[k] = clone(t);
      new Set(Object.keys(b).concat(Object.keys(m), Object.keys(t))).forEach((c) => {
        const theyChanged = !same(t[c], b[c]) && !same(t[c], m[c]);
        if (theyChanged) remote = true;
        if (same(m[c], b[c]) || same(t[c], m[c])) return;
        if (k === 'qm') { out.qm[c] = Math.max(0, (t[c] || 0) + (m[c] || 0) - (b[c] || 0)); return; }
        if (theyChanged) { lost.push(c); return; }
        put(out.slots, c, m[c]);
      });
      return;
    }
    const theyChanged = !same(theirs[k], base[k]) && !same(theirs[k], mine[k]);
    if (theyChanged) remote = true;
    else if (!same(mine[k], base[k])) put(out, k, mine[k]);
  });
  return { p: out, lost: lost, remote: remote };
}

function stash() { try { sessionStorage.setItem('xh_pending', JSON.stringify({ base: STATE.v || 0, b: pendingBase, p: pending })); } catch (e) { /* no storage */ } }
function clearStash() { pendingBase = null; try { sessionStorage.removeItem('xh_pending'); } catch (e) { /* no storage */ } }
function restoreStash() {
  try {
    const raw = sessionStorage.getItem('xh_pending');
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o && o.p && o.b) { pending = rebase(o.b, o.p, STATE).p; pendingBase = clone(STATE); }
    else if (o && o.base === (STATE.v || 0) && o.p) { pending = o.p; pendingBase = clone(STATE); }
    else sessionStorage.removeItem('xh_pending');
  } catch (e) { /* ignore */ }
}
function saveTab() { try { sessionStorage.setItem('xh_tab', ui.tab); } catch (e) { /* ignore */ } }

function errText(e) {
  const c = String((e && e.code) || '');
  if (c.includes('permission-denied')) return '沒有權限，請確認是用主持人帳號登入';
  if (c.includes('unavailable') || c.includes('network')) return '連不上網路，請確認連線後再試一次';
  if (c.includes('popup-closed')) return '登入視窗被關掉了';
  if (c.includes('popup-blocked')) return '瀏覽器擋住了登入視窗';
  return (e && (e.message || e.code)) || String(e);
}

let toastTimer = null;
function toastEl() {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite'); document.body.appendChild(el); }
  return el;
}
function toast(msg, ms) {
  const el = toastEl();
  el.textContent = msg;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); el.textContent = ''; }, ms || (String(msg).length > 22 ? 6000 : 3200));
}

function unlocked(tab, s) { return tab.host ? host : s.phase >= tab.phase; }
const forcePlayer = () => /^#player\b/.test(location.hash || '');

/* ---------- generic block renderer ---------- */
function table(rows) {
  if (!rows || !rows.length) return '';
  const [head, ...body] = rows;
  return '<div class="tblwrap"><table class="tbl"><thead><tr>' + head.map((c) => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
    body.map((r) => '<tr>' + r.map((c) => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
}
function isStage(s) { return s.startsWith('（') && s.endsWith('）'); }
function letterHtml() {
  const lines = CONTENT.letter;
  const last = lines[lines.length - 1];
  return '<div class="letter">' + lines.slice(0, -1).map((l) => '<p>' + esc(l) + '</p>').join('') +
    '<div class="sig"><span>' + esc(last) + '</span><span class="seal" aria-hidden="true">田</span></div></div>';
}
function blocks(bs, opt) {
  opt = opt || {};
  let out = '', list = [];
  const flush = () => { if (list.length) { out += '<ul class="list">' + list.map((li) => '<li>' + esc(li) + '</li>').join('') + '</ul>'; list = []; } };
  for (const b of bs) {
    if (b.t === 'li') { list.push(b.s); continue; }
    flush();
    if (b.t === 'p') {
      let s = b.s;
      if (opt.strip && isStage(s)) continue;
      if (opt.letter && s.startsWith('「我去看')) { out += letterHtml(); continue; }
      if (opt.place !== undefined) s = s.replace('（複述該組說的地方）', opt.place ? opt.place : '……');
      out += '<p>' + esc(s) + '</p>';
    } else if (b.t === 'h3' || b.t === 'h2') {
      out += '<h3 class="sub">' + esc(b.s) + '</h3>';
    } else if (b.t === 'table') {
      out += table(b.rows);
    }
  }
  flush();
  return out;
}

/* ---------- new cards (players) ---------- */
function noticeCards(prev, next) {
  const mine = myTeam();
  const got = [], opened = [];
  const was = prev.slots || {};
  Object.keys(next.slots || {}).forEach((code) => {
    const st = next.slots[code], old = was[code];
    if (mine && st.by === mine) { if (!(old && old.by === mine)) got.push(code); }
    else if (st.pub && !(old && old.pub)) opened.push(code);
  });
  const fresh = got.concat(opened);
  if (!fresh.length) return '';
  ui.fresh = Array.from(new Set(ui.fresh.concat(got)));
  if (ui.tab === 'search' && !ui.picking) ui.flash = fresh;
  else ui.unseen = Array.from(new Set(ui.unseen.concat(fresh)));
  if (got.length) { try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) { /* not supported */ } }
  return got.length ? '你們組拿到新卡：' + got.join('、') + (opened.length ? '・另有 ' + opened.length + ' 張新公開' : '')
    : '新公開的卡：' + opened.join('、');
}

function noticeSoup(prev, next) {
  if ((next.hints || 0) > (prev.hints || 0)) {
    const h = CONTENT.hints[next.hints - 1];
    return h ? '主持人公布了提示 ' + next.hints + '：' + h.text : '';
  }
  const pq = prev.qa || [], nq = next.qa || [], mine = myTeam();
  if (nq.length > pq.length && mine) {
    const x = nq[nq.length - 1];
    if (x && x.t === mine) return '你們問「' + x.q + '」・村長說：' + x.a;
  }
  return '';
}
function noticeReveal(prev, next) {
  if (prev.truth || !next.truth) return '';
  ui.tab = 'answer'; ui.picking = false; saveTab(); window.scrollTo(0, 0);
  return '答案公布了・拆開明信片看看';
}

/* ---------- Firebase ---------- */
function evalHost() {
  const u = fb.user;
  host = !!(u && !u.isAnonymous && fb.hosts && fb.hosts.includes(u.uid)) && !forcePlayer();
  if (fb.demo) host = /^#host\b/.test(location.hash || '') && !forcePlayer();
  if (fb.ok && host && !fb.reqUnsub) subscribeRequests();
  if (!host && fb.reqUnsub) { fb.reqUnsub(); fb.reqUnsub = null; fb.requests = {}; }
}

/* co-host requests: only hosts may read them (rules) */
function subscribeRequests() {
  fb.reqUnsub = fb.db.collection('requests').onSnapshot((qs) => {
    const r = {}; qs.forEach((d) => { r[d.id] = d.data(); }); fb.requests = r; render();
  }, () => { fb.requests = {}; });
}
async function approveHost(uid) {
  const r = fb.requests[uid] || {};
  const FV = firebase.firestore.FieldValue;
  const upd = { hosts: FV.arrayUnion(uid) };
  upd['hostInfo.' + uid] = { email: r.email || '', name: r.name || '', at: Date.now() };
  try { await fb.db.doc('game/config').update(upd); await fb.db.doc('requests/' + uid).delete(); toast('已加入為主持人'); }
  catch (e) { toast('失敗：' + errText(e)); }
}
async function removeHost(uid) {
  if (fb.user && uid === fb.user.uid) { toast('不能移除自己'); return; }
  const FV = firebase.firestore.FieldValue;
  const upd = { hosts: FV.arrayRemove(uid) };
  upd['hostInfo.' + uid] = FV.delete();
  try { await fb.db.doc('game/config').update(upd); toast('已移除主持人'); }
  catch (e) { toast('失敗：' + errText(e)); }
}
async function rejectRequest(uid) {
  try { await fb.db.doc('requests/' + uid).delete(); }
  catch (e) { toast('失敗：' + errText(e)); }
}

let subscribed = false;
function subscribeAll() {
  if (subscribed) return;
  subscribed = true;
  fb.db.doc('game/state').onSnapshot((snap) => {
    const prev = STATE, prevPhase = STATE.phase;
    STATE = snap.exists ? Object.assign({}, DEFAULT_STATE, snap.data()) : DEFAULT_STATE;
    if (!Array.isArray(STATE.teams) || !STATE.teams.length || !STATE.teams.every((t) => TEAM_ORDER.includes(t))) {
      // state written by an older version: show default teams until the host resets
      STATE = Object.assign({}, STATE, { teams: DEFAULT_STATE.teams, qm: DEFAULT_STATE.qm });
    }
    const notes = fb.live && !host ? [noticeReveal(prev, STATE), noticeCards(prev, STATE), noticeSoup(prev, STATE)] : [];
    if (fb.live && !host && STATE.phase !== prevPhase) {
      // the host moved the game on: take players to that phase's page
      ui.tab = DEFAULT_TAB[STATE.phase] || 'open'; ui.picking = false; saveTab();
      toast(notes[0] || '進入「' + phaseName(STATE.phase) + '」');
      window.scrollTo(0, 0);
    } else if (notes.find(Boolean)) toast(notes.find(Boolean));
    if (host && pending && pendingBase && (STATE.v || 0) !== (pendingBase.v || 0)) {
      // another host (or this phone's own write) changed the live state: keep the unsent batch on top of it
      const r = rebase(pendingBase, pending, STATE);
      pending = r.p; pendingBase = clone(STATE); stash();
      if (r.lost.length) toast('另一位主持人剛改了 ' + r.lost.join('、') + '，以對方的為準，你對這幾張的改動取消了');
      else if (r.remote) toast('另一位主持人剛送出更新，已併入你還沒送出的變更');
    }
    fb.live = true;
    if (!pending) restoreStash();
    render();
  }, (err) => { fb.error = '讀取遊戲狀態失敗：' + errText(err); render(); });
  fb.db.doc('game/config').onSnapshot((snap) => {
    fb.config = snap.exists ? snap.data() : null;
    fb.hosts = fb.config ? (fb.config.hosts || []) : [];
    evalHost(); render();
  }, (err) => { fb.config = null; fb.hosts = []; evalHost(); render(); });
  fb.db.collection('players').onSnapshot((qs) => {
    const p = {}; qs.forEach((d) => { p[d.id] = d.data(); }); fb.players = p;
    const mine = fb.user && p[fb.user.uid];
    if (mine && mine.team && mine.team !== player.team) setTeam(mine.team);
    render();
  }, () => { /* counts stay empty */ });
}

function initFirebase() {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || String(cfg.apiKey).indexOf('__') === 0) { fb.demo = true; fb.error = '尚未設定 Firebase（config.js），目前是離線示範模式。'; evalHost(); render(); return; }
  if (typeof firebase === 'undefined') { fb.demo = true; fb.error = 'Firebase SDK 沒有載入，請檢查網路。'; evalHost(); render(); return; }
  try {
    firebase.initializeApp(cfg);
    fb.auth = firebase.auth();
    fb.db = firebase.firestore();
    fb.ok = true;
  } catch (e) { fb.demo = true; fb.error = 'Firebase 初始化失敗：' + e.message; evalHost(); render(); return; }
  fb.auth.onAuthStateChanged(async (u) => {
    fb.user = u;
    if (!u) {
      try { await fb.auth.signInAnonymously(); } catch (e) { fb.error = '匿名登入失敗：' + (e.code || e.message) + '。請在 Firebase 啟用匿名登入。'; render(); }
      return;
    }
    fb.error = null;
    evalHost();
    subscribeAll();
    render();
  });
}

async function hostLogin() {
  if (!fb.ok) { toast('尚未連接 Firebase'); return; }
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    const res = await fb.auth.signInWithPopup(provider);
    const u = res.user;
    const info = { email: u.email || '', name: u.displayName || '', at: Date.now() };
    const ref = fb.db.doc('game/config');
    const snap = await ref.get();
    if (!snap.exists) {
      const hostInfo = {}; hostInfo[u.uid] = info;
      await ref.set({ hosts: [u.uid], hostInfo: hostInfo, claimedAt: Date.now() });
      toast('你已成為這場遊戲的主持人');
    } else if (!(snap.data().hosts || []).includes(u.uid)) {
      await fb.db.doc('requests/' + u.uid).set(info);
      toast('已送出申請，請主持人在「主持手冊」分頁核准');
    }
  } catch (e) {
    if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user')) {
      try { await fb.auth.signInWithRedirect(provider); } catch (e2) { toast('登入失敗：' + (e2.code || e2.message)); }
    } else toast('登入失敗：' + errText(e));
  }
}
async function hostLogout() {
  if (!fb.ok) return;
  pending = null; clearStash(); ui.preview = false;
  try { await fb.auth.signOut(); } catch (e) { /* onAuthStateChanged signs in anonymously again */ }
}

async function publish() {
  if (!pending || publishing) return;
  if (!fb.ok || !host) { toast(fb.demo ? '示範模式無法更新' : '沒有主持人權限'); return; }
  publishing = true; render();
  const next = clone(pending);
  next.v = (STATE.v || 0) + 1;
  next.updatedAt = Date.now();
  try {
    await fb.db.doc('game/state').set(next);
    pending = null; clearStash();
    toast('已更新給所有人');
  } catch (e) { toast('更新失敗：' + errText(e)); }
  publishing = false; render();
}

async function resetGame() {
  if (!fb.ok || !host) return;
  const fresh = clone(DEFAULT_STATE);
  fresh.v = 1;   // a reset starts the version count over
  fresh.teams = S().teams.filter((t) => TEAM_ORDER.includes(t)); if (fresh.teams.length < 2) fresh.teams = DEFAULT_STATE.teams.slice();
  fresh.players = S().players; fresh.assign = S().assign;
  fresh.rounds = S().rounds || 6;
  fresh.qm = {}; fresh.teams.forEach((t) => { fresh.qm[t] = BASE_QM; });
  try {
    await fb.db.doc('game/state').set(fresh);
    const qs = await fb.db.collection('players').get();
    const batch = fb.db.batch(); qs.forEach((d) => batch.delete(d.ref)); await batch.commit();
    pending = null; clearStash(); ui.resetArmed = false;
    toast('已重設為 v1，玩家名單也清空了');
  } catch (e) { toast('重設失敗：' + ((e && e.code) || e)); }
  render();
}

/* ---------- timer ---------- */
// elapsed time of the 問村長 timer; a paused timer stops counting at soupPause
function soupElapsedMs(s) { return s.soupStart ? (s.soupPause || Date.now()) - s.soupStart : 0; }
function timerText(s) {
  const el = Math.floor(soupElapsedMs(s) / 1000);
  const rem = 1800 - el;
  const t = Math.abs(rem);
  const mm = String(Math.floor(t / 60)).padStart(2, '0');
  const ss = String(t % 60).padStart(2, '0');
  return (rem < 0 ? '−' : '') + mm + ':' + ss + '<small>' + (s.soupPause ? '已暫停・' : '') + (rem < 0 ? '已超過 30 分' : '剩餘') + '・已進行 ' + Math.floor(el / 60) + ' 分</small>';
}
let hintReminded = {}, hintTimerBase = null;
function tick() {
  const s = S();
  const el = $('#timer');
  if (el && s.soupStart) {
    el.innerHTML = timerText(s);
    el.classList.toggle('over', soupElapsedMs(s) > 1800000);
    el.classList.toggle('paused', !!s.soupPause);
  }
  if (host) {
    const due = dueHint(s);
    if (due !== ui.dueHint) { ui.dueHint = due; if (ui.tab === 'soup' && !ui.preview) render(); }
  }
  // remind the host when a hint's minute mark passes
  if (host && s.soupStart && !s.soupPause) {
    if (hintTimerBase !== s.soupStart) { hintTimerBase = s.soupStart; hintReminded = {}; }
    const min = Math.floor(soupElapsedMs(s) / 60000);
    CONTENT.hints.forEach((h, i) => {
      if (min >= h.min && s.hints <= i && !hintReminded[i]) { hintReminded[i] = true; toast('第 ' + h.min + ' 分鐘到了，可以公布提示 ' + (i + 1) + '：' + h.text); }
    });
  }
}
setInterval(tick, 1000);

/* ---------- send state (host) ---------- */
function unsent(code) { return !!(host && pending && !same(pending.slots[code], STATE.slots[code])); }
function pendingList() {
  if (!pending) return [];
  const out = [];
  const codes = new Set(Object.keys(pending.slots).concat(Object.keys(STATE.slots)));
  allDecks().forEach((d) => d.cards.forEach((c) => { if (codes.has(c.code) && !same(pending.slots[c.code], STATE.slots[c.code])) out.push(c.code); }));
  if (pending.phase !== STATE.phase) out.push('階段');
  if (pending.round !== STATE.round) out.push('輪次');
  if ((pending.note || '') !== (STATE.note || '')) out.push('公告');
  if (!!pending.autoPublic !== !!STATE.autoPublic) out.push('抽到即公開');
  return out;
}
